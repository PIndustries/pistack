# Tests mint ID tokens with a locally generated RSA key and serve a JWKS from a
# tiny in-process HTTP server. `rsa` re-exports the `sha2` and `rand_core` the
# signing needs, so no separate crypto dev-deps are pulled in.
rsa = { version = "0.9", features = ["sha2", "getrandom"] }
