<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiStack</title>
<style>
  :root {
    --bg: #04060a;
    --panel: rgba(14, 30, 18, .92);
    --panel-solid: #0c1610;
    --line: rgba(75, 222, 128, .22);
    --text: #eafaef;
    --muted: #7e9b86;
    --accent: #34c759;
    --ok: #8df06a;
    --press: #159a3c;
    --ink: #04140a;
    --bad: #e07a6a;
    --wait: #c5d6a8;
    --field: #07140c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 520px at 50% -12%, rgba(52, 199, 89, .09), transparent 58%),
      var(--bg);
    color: var(--text);
    font: 15px/1.45 ui-sans-serif, system-ui, sans-serif;
  }
  button, input, select, textarea {
    font: inherit;
    color: inherit;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.45rem 0.65rem;
  }
  button { cursor: pointer; background: var(--panel-solid); }
  button.primary { background: var(--accent); color: var(--ink); border-color: transparent; font-weight: 650; }
  button.primary:active { background: var(--press); }
  button.danger { color: var(--bad); }
  canvas.screen {
    width: 100%;
    height: auto;
    background: #000;
    border: 1px solid var(--line);
    display: block;
    margin-top: 0.8rem;
  }
  button.linkish {
    background: transparent;
    border-color: transparent;
    color: var(--ok);
    padding: 0;
    font-weight: 650;
    text-align: left;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible, input:focus, select:focus, textarea:focus {
    outline: 2px solid rgba(52, 199, 89, .55);
    outline-offset: 1px;
  }
  a { color: var(--accent); }
  /* display is only set when the section is shown. A plain display rule
     beats the hidden attribute, which left the login card on top of the
     console after sign-in. */
  #login:not([hidden]) {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
  }
  #login h1::after {
    content: "";
    display: inline-block;
    width: 0.48rem;
    height: 0.48rem;
    margin-left: 0.4rem;
    border-radius: 50%;
    background: var(--ok);
    vertical-align: 0.12em;
  }
  #login form, .card, form.create, .detail, .once {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.25rem;
  }
  #login form, .card { width: min(420px, 100%); }
  h1 { font-size: 1.35rem; margin: 0 0 0.25rem; }
  h2, h3 { font-weight: 650; }
  h2 { font-size: 1.15rem; margin: 0; }
  h3 { font-size: 0.95rem; margin: 1rem 0 0.35rem; }
  .sub { color: var(--muted); margin: 0 0 1rem; }
  label { display: block; margin: 0.7rem 0 0.25rem; color: var(--muted); font-size: 0.85rem; }
  input, select, textarea { width: 100%; }
  textarea { min-height: 4.5rem; resize: vertical; }
  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: end; }
  .row > * { flex: 1; min-width: 8rem; }
  #shell:not([hidden]) { display: grid; grid-template-columns: 200px 1fr; min-height: 100vh; }
  #shell:not([hidden]) > div { min-width: 0; }
  nav { border-right: 1px solid var(--line); padding: 1rem 0.6rem; background: var(--field); }
  nav button { display: block; width: 100%; text-align: left; margin: 0.15rem 0; background: transparent; border-color: transparent; }
  nav button[aria-current="page"], nav button:active { background: var(--press); color: var(--ink); border-color: transparent; font-weight: 650; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.8rem 1.1rem; border-bottom: 1px solid var(--line);
  }
  main { padding: 1rem 1.1rem 2rem; min-width: 0; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.45rem 0.4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 0.78rem; letter-spacing: 0.03em; }
  .phase { text-transform: lowercase; }
  .phase.ready, .phase.on, .phase.running, .phase.succeeded, .phase.ok, .phase.accepted { color: var(--ok); }
  .phase.error, .phase.off, .phase.failed, .phase.firing { color: var(--bad); }
  .phase.pending, .phase.creating, .phase.deleting, .phase.unknown { color: var(--wait); }
  .rules { margin: 0.25rem 0 0; padding-left: 1.1rem; }
  .detail { width: min(760px, 100%); }
  .detail p { margin: 0.22rem 0; }
  .detail .k { color: var(--muted); display: inline-block; min-width: 9.5rem; }
  .once { color: var(--ok); border-radius: 8px; padding: 0.6rem 0.75rem; margin: 0 0 0.8rem; word-break: break-all; }
  #err, #note, #login-err:not(:empty) {
    border-radius: 8px; padding: 0.6rem 0.75rem; margin: 0 0 0.8rem;
  }
  #err { background: #3a2222; color: #ffd0c8; display: none; }
  #login-err:not(:empty) { background: #3a2222; color: #ffd0c8; }
  #note { background: var(--panel); color: var(--muted); border: 1px solid var(--line); }
  #note:empty { display: none; }
  .tools { display: flex; gap: 0.5rem; align-items: center; margin: 0 0 0.8rem; flex-wrap: wrap; }
  form.create { border-radius: 10px; padding: 0.8rem; margin: 0 0 1rem; width: auto; }
  @media (max-width: 800px) {
    #login:not([hidden]) { padding: 1rem; }
    #shell:not([hidden]) { grid-template-columns: 1fr; }
    nav { display: flex; gap: 0.25rem; overflow: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    nav button { width: auto; white-space: nowrap; }
  }
</style>
</head>
<body>
<section id="login">
  <form id="login-form" autocomplete="off" onsubmit="event.preventDefault()">
    <h1>PiStack</h1>
    <p class="sub">Sign in to this cloud. The token stays in this tab.</p>
    <label for="user">Name</label>
    <input id="user" name="name" autocomplete="username" value="admin" required>
    <label for="pass">Password</label>
    <input id="pass" name="password" type="password" autocomplete="off" spellcheck="false" required>
    <p id="login-err"></p>
    <button class="primary" type="submit">Sign in</button>
  </form>
</section>
<div id="shell" hidden>
  <nav>
    <button type="button" data-view="machines" aria-current="page">Machines</button>
    <button type="button" data-view="hosts">Hosts</button>
    <button type="button" data-view="networks">Networks</button>
    <button type="button" data-view="subnets">Subnets</button>
    <button type="button" data-view="ports">Ports</button>
    <button type="button" data-view="routers">Routers</button>
    <button type="button" data-view="security">Security groups</button>
    <button type="button" data-view="fips">Floating IPs</button>
    <button type="button" data-view="volumes">Volumes</button>
    <button type="button" data-view="images">Images</button>
    <button type="button" data-view="buckets">Buckets</button>
    <button type="button" data-view="projects">Projects</button>
    <button type="button" data-view="users">Users</button>
    <button type="button" data-view="keys">Keys</button>
    <button type="button" data-view="secrets">Secrets</button>
    <button type="button" data-view="dns">DNS</button>
    <button type="button" data-view="balancers">Load balancers</button>
    <button type="button" data-view="pods">Pods</button>
    <button type="button" data-view="deployments">Deployments</button>
    <button type="button" data-view="services">Services</button>
    <button type="button" data-view="jobs">Jobs</button>
    <button type="button" data-view="ingresses">Ingresses</button>
    <button type="button" data-view="stacks">Stacks</button>
    <button type="button" data-view="shares">Shares</button>
    <button type="button" data-view="alarms">Alarms</button>
  </nav>
  <div>
    <header>
      <strong id="who">PiStack</strong>
      <button type="button" id="logout">Sign out</button>
    </header>
    <main>
      <p id="note"></p>
      <div id="err"></div>
      <div id="view"></div>
    </main>
  </div>
</div>
<script>
const VIEWS = {
  machines: {
    title: "Machines",
    path: "/compute/machines",
    note: "Guests boot on the host NAT network 10.88.0.0/24. SSH from the fleet host as ubuntu@the address. Attach a volume from Volumes and it shows up in the guest as a virtio disk.",
    cols: [
      ["Name", i => i.name],
      ["Phase", i => i.status && i.status.phase],
      ["Power", i => i.status && i.status.power],
      ["Size", i => i.spec && i.spec.size],
      ["Image", i => i.spec && i.spec.image],
      ["Address", i => ((i.status && i.status.addresses) || []).join(", ")],
      ["Floating IP", i => matchingFips(i, machineFips).map(f => f.spec && f.spec.address).filter(Boolean).join(", ")],
    ],
    actions: true,
  },
  hosts: {
    title: "Hosts",
    path: "/compute/hosts",
    cols: [
      ["Name", i => i.name],
      ["Phase", i => i.status && i.status.phase],
      ["Node", i => i.spec && i.spec.node_name],
      ["vCPU free", i => i.status && i.status.free && (i.status.free.vcpus + " / " + (i.spec.capacity ? i.spec.capacity.vcpus : ""))],
      ["Drivers", i => ((i.spec && i.spec.drivers) || []).join(", ")],
    ],
  },
  networks: {
    title: "Networks",
    path: "/network/networks",
    cols: [
      ["Name", i => i.name],
      ["Phase", i => i.status && i.status.phase],
      ["Type", i => i.spec && i.spec.kind && i.spec.kind.type],
      ["External", i => i.spec && String(!!i.spec.external)],
    ],
  },
  subnets: {
    title: "Subnets",
    path: "/network/subnets",
    cols: [
      ["Name", i => i.name],
      ["Phase", i => i.status && i.status.phase],
      ["CIDR", i => i.spec && i.spec.cidr],
      ["Gateway", i => i.spec && i.spec.gateway],
      ["Network", i => i.spec && i.spec.network],
    ],
  },
  ports: {
    title: "Ports",
    path: "/network/ports",
    cols: [
      ["Name", i => i.name],
      ["Phase", i => i.status && i.status.phase],
      ["MAC", i => i.spec && i.spec.mac],
      ["Fixed IPs", i => ((i.spec && i.spec.fixed_ips) || []).join(", ")],
      ["Device", i => i.spec && i.spec.device],
      ["Network", i => i.spec && i.spec.network],
    ],
  },
  routers: {
    title: "Routers",
    path: "/network/routers",
    cols: [
      ["Name", i => i.name],
      ["Phase", i => i.status && i.status.phase],
      ["External network", i => i.spec && i.spec.external_network],
      ["External IP", i => i.status && i.status.external_ip],
    ],
  },
  security: {
    title: "Security groups",
    path: "/network/security-groups",
    note: "Ingress rules on a member port are installed on the host. Traffic that does not match is dropped.",
    cols: [
      ["Name", i => i.name],
      ["Phase", i => i.status && i.status.phase],
      ["Rules", i => (i.spec && i.spec.rules ? i.spec.rules.length : 0)],
      ["Members", i => i.status && i.status.members],
    ],
    rules: true,
  },
  fips: {
    title: "Floating IPs",
    path: "/network/floating-ips",
    note: "A floating IP is an address on the fleet tunnel, drawn from 10.66.66.80/28. Associate it with a machine and that address reaches the guest. Traffic is accepted only from 10.66.66.0/24.",
    cols: [
      ["Name", i => i.name],
      ["Phase", i => i.status && i.status.phase],
      ["Address", i => i.spec && i.spec.address],
      ["Fixed", i => i.status && i.status.fixed_ip],
      ["Machine port", i => i.spec && i.spec.port],
    ],
  },
  volumes: {
    title: "Volumes",
    path: "/volume/volumes",
    note: "Create a volume, then attach it to a running machine. Attach still hotplugs; the guest sees a new virtio disk. Detach before delete. A snapshot is a copy of the volume file.",
    cols: [
      ["Name", i => i.name],
      ["Phase", i => i.status && i.status.phase],
      ["GiB", i => i.spec && i.spec.size_gib],
      ["Device", i => i.status && i.status.device],
      ["Attached", i => i.status && i.status.attached_to],
    ],
  },
  images: {
    title: "Images",
    path: "/image/images",
    note: "Import stores the file in the catalog. A new machine whose image name matches a Ready catalog image boots that file.",
    cols: [
      ["Name", i => i.name],
      ["Phase", i => i.status && i.status.phase],
      ["Format", i => i.spec && i.spec.format],
      ["Size", i => i.status && i.status.size_bytes],
    ],
  },
  buckets: {
    title: "Buckets",
    path: "/silo/buckets",
    note: "Stored by silo. This screen does not upload objects yet.",
    cols: [
      ["Name", i => i.name],
      ["Phase", i => i.status && i.status.phase],
    ],
  },
  projects: {
    title: "Projects",
    path: "/identity/projects",
    cols: [
      ["Name", i => i.name],
      ["ID", i => i.id],
      ["Enabled", i => yesNo(i.spec && i.spec.enabled)],
    ],
  },
  users: {
    title: "Users",
    path: "/identity/principals",
    cols: [
      ["Name", i => i.name],
      ["Kind", i => i.spec && i.spec.kind],
      ["Enabled", i => yesNo(i.spec && i.spec.enabled)],
    ],
  },
  keys: {
    title: "Keys",
    path: "/identity/keys",
    note: "A new key secret is shown once on this page, then dropped.",
    cols: [
      ["Name", i => i.name],
      ["ID", i => i.id],
      ["Principal", i => i.spec && i.spec.principal],
      ["Project", i => i.spec && i.spec.project],
      ["Expires", i => i.spec && i.spec.expires_at],
    ],
  },
  secrets: {
    title: "Secrets",
    path: "/secrets/secrets",
    note: "Stored by keep. This screen lists names only.",
    cols: [
      ["Name", i => i.name],
      ["ID", i => i.id],
      ["Kind", i => i.spec && i.spec.kind],
    ],
  },
  dns: {
    title: "DNS",
    path: "/dns/zones",
    note: "A zone labelled pistack.io/auto=true gets an A record for each machine, using its floating IP.",
    multi: "dns",
  },
  balancers: {
    title: "Load balancers",
    path: "/balancers/balancers",
    note: "Stored by relay. Nothing is programmed on the host yet.",
    multi: "balancers",
  },
  pods: {
    title: "Pods",
    path: "/loom/pods",
    note: "Phase and address are the pod status. Images lists each container.",
    cols: [
      ["Name", i => i.name],
      ["Phase", i => i.status && i.status.phase],
      ["Address", i => i.status && i.status.pod_ip],
      ["Images", i => containerImages(i.spec)],
      ["Host", i => i.status && i.status.host],
      ["Machine", i => i.status && i.status.machine],
    ],
  },
  deployments: {
    title: "Deployments",
    path: "/loom/deployments",
    note: "Ready, available, and updated are counts from the deployment status.",
    cols: [
      ["Name", i => i.name],
      ["Replicas", i => num(i.spec, "replicas")],
      ["Ready", i => num(i.status, "ready")],
      ["Available", i => num(i.status, "available")],
      ["Updated", i => num(i.status, "updated")],
      ["Revision", i => num(i.status, "revision")],
      ["Image", i => templateImages(i)],
    ],
  },
  services: {
    title: "Services",
    path: "/loom/services",
    note: "Kind, ports, and selector are the spec. The cluster address and endpoint count are status.",
    cols: [
      ["Name", i => i.name],
      ["Kind", i => i.spec && i.spec.kind],
      ["Cluster IP", i => i.status && i.status.cluster_ip],
      ["Ports", i => ((i.spec && i.spec.ports) || []).map(p => p.port).join(", ")],
      ["Selector", i => selectorText(i.spec && i.spec.selector)],
      ["Endpoints", i => (i.status && i.status.endpoints) ? i.status.endpoints.length : 0],
    ],
  },
  jobs: {
    title: "Jobs",
    path: "/loom/jobs",
    note: "Active, succeeded, and failed are the job status.",
    cols: [
      ["Name", i => i.name],
      ["Completions", i => num(i.spec, "completions")],
      ["Parallelism", i => num(i.spec, "parallelism")],
      ["Active", i => num(i.status, "active")],
      ["Succeeded", i => num(i.status, "succeeded")],
      ["Failed", i => num(i.status, "failed")],
      ["Image", i => templateImages(i)],
      ["Suspended", i => yesNo(i.spec && i.spec.suspend)],
    ],
  },
  ingresses: {
    title: "Ingresses",
    path: "/loom/ingresses",
    note: "Rules are stored as written. Addresses are status and stay empty until filled.",
    cols: [
      ["Name", i => i.name],
      ["Hosts", i => ingressHosts(i)],
      ["Paths", i => ingressPaths(i)],
      ["Addresses", i => ((i.status && i.status.load_balancer) || []).join(", ")],
    ],
  },
  stacks: {
    title: "Stacks",
    path: "/blueprint/stacks",
    note: "Apply creates missing rows from the document, updates the rows an earlier apply of the stack created, and deletes managed rows the document no longer names. The phase is applying, then ready or failed. Roll back re-applies the previous revision.",
    cols: [
      ["Name", i => i.name],
      ["Phase", i => i.status && i.status.phase],
      ["Revision", i => i.status && i.status.revision],
      ["Created", i => ((i.status && i.status.created) || []).join(", ")],
      ["Updated", i => ((i.status && i.status.updated) || []).join(", ")],
      ["Message", i => i.status && i.status.message],
    ],
    apply: true,
    rollback: true,
  },
  shares: {
    title: "Shares",
    path: "/shelf/shares",
    note: "NFS is ready after exportfs. CephFS is ready after the subvolume is created.",
    cols: [
      ["Name", i => i.name],
      ["Phase", i => i.status && i.status.phase],
      ["Protocol", i => i.spec && i.spec.protocol],
      ["GiB", i => num(i.spec, "size_gib")],
      ["Access", i => accessText(i)],
      ["Message", i => i.status && i.status.message],
    ],
  },
  alarms: {
    title: "Alarms",
    path: "/gauge/alarms",
    note: "Pending means no sample for that metric yet. Ok and firing follow the latest sample against the threshold.",
    cols: [
      ["Name", i => i.name],
      ["Phase", i => i.status && i.status.phase],
      ["Metric", i => i.spec && i.spec.metric],
      ["Comparison", i => i.spec && i.spec.comparison],
      ["Threshold", i => num(i.spec, "threshold")],
      ["Last", i => (i.status && i.status.last_value != null) ? i.status.last_value : ""],
      ["For seconds", i => num(i.spec, "for_seconds")],
    ],
  },
};

let current = "machines";
let timer = 0;
let renderGen = 0;
let openMachine = null;
let machineFips = [];
// One-time key secret. Shown in the DOM, then dropped. Not stored.
let keyOnce = null;

function el(tag, text, cls) {
  const n = document.createElement(tag);
  if (text != null) n.textContent = text;
  if (cls) n.className = cls;
  return n;
}
function token() { return sessionStorage.getItem("pistack.token") || ""; }
function setToken(t) { sessionStorage.setItem("pistack.token", t); }
function clearToken() { sessionStorage.removeItem("pistack.token"); }

async function api(method, path, body, auth) {
  const headers = {};
  if (auth !== false && token()) headers.Authorization = "Bearer " + token();
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const res = await fetch(path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
  const text = await res.text();
  let data = null;
  if (text) {
    try { data = JSON.parse(text); } catch (e) { data = { error: { message: text.slice(0, 200) } }; }
  }
  if (res.status === 401 && auth !== false) { showLogin(); throw new Error("session ended"); }
  if (!res.ok) throw new Error((data && data.error && data.error.message) || res.statusText);
  return data;
}

function showLogin() {
  clearToken();
  keyOnce = null;
  openMachine = null;
  document.getElementById("shell").hidden = true;
  document.getElementById("login").hidden = false;
}
function showApp() {
  document.getElementById("login").hidden = true;
  document.getElementById("shell").hidden = false;
}
function setErr(msg) {
  const n = document.getElementById("err");
  n.style.display = msg ? "block" : "none";
  n.textContent = msg || "";
}
function option(value, label) {
  const o = el("option", label == null ? value : label);
  o.value = value;
  return o;
}
function yesNo(v) {
  if (v == null || v === "") return "";
  return v ? "yes" : "no";
}
function show(value) {
  return value == null || value === "" ? "—" : String(value);
}
function bareAddr(value) {
  const s = String(value == null ? "" : value).trim();
  const i = s.indexOf("/");
  return i === -1 ? s : s.slice(0, i).trim();
}
function matchingFips(machine, fips) {
  const addrs = {};
  for (const a of (machine.status && machine.status.addresses) || []) {
    addrs[String(a)] = true;
    const bare = bareAddr(a);
    if (bare) addrs[bare] = true;
  }
  return (fips || []).filter(f => {
    const fixed = f.status && f.status.fixed_ip;
    if (!fixed) return false;
    return addrs[String(fixed)] || addrs[bareAddr(fixed)];
  });
}
function ruleLine(r) {
  const dir = r.direction || "—";
  const proto = r.protocol || "any";
  let ports = "any";
  if (r.port_range && r.port_range.min != null && r.port_range.max != null) {
    ports = String(r.port_range.min) === String(r.port_range.max)
      ? String(r.port_range.min)
      : String(r.port_range.min) + "-" + String(r.port_range.max);
  }
  let remote = "any";
  if (r.remote && typeof r.remote === "object") {
    if (r.remote.cidr) remote = String(r.remote.cidr);
    else if (r.remote.group) remote = String(r.remote.group);
  } else if (typeof r.remote === "string" && r.remote) {
    remote = r.remote;
  }
  return dir + " · " + proto + " · " + ports + " · " + remote;
}
function protoText(p) {
  if (p == null || p === "") return "";
  if (typeof p === "string") return p;
  if (p.type) return String(p.type);
  return "";
}
function itemsOf(page) {
  return (page && page.items) || [];
}
function num(obj, key) {
  if (!obj || obj[key] == null || obj[key] === "") return "";
  return obj[key];
}
function intField(value, label, min, max) {
  const n = Number(String(value).trim());
  if (!Number.isInteger(n) || n < min || (max != null && n > max)) {
    throw new Error(max == null
      ? label + " must be an integer >= " + min
      : label + " must be an integer from " + min + " to " + max);
  }
  return n;
}
function containerImages(spec) {
  return ((spec && spec.containers) || []).map(c => c.image).filter(Boolean).join(", ");
}
function templateImages(item) {
  const template = item.spec && item.spec.template;
  return containerImages(template && template.spec);
}
function selectorText(sel) {
  if (!sel || typeof sel !== "object") return "";
  return Object.keys(sel).map(k => k + "=" + sel[k]).join(", ");
}
function accessText(item) {
  return ((item.spec && item.spec.access) || []).map(a => {
    const who = a.cidr || a.principal || "";
    const mode = a.mode || "";
    return mode ? who + " " + mode : who;
  }).filter(Boolean).join(", ");
}
function ingressHosts(item) {
  return ((item.spec && item.spec.rules) || []).map(r => r.host).filter(Boolean).join(", ");
}
function ingressPaths(item) {
  const out = [];
  for (const rule of (item.spec && item.spec.rules) || []) {
    for (const path of rule.paths || []) {
      const backend = path.backend || {};
      const dest = backend.service ? backend.service + ":" + backend.port : "";
      out.push(dest ? (path.path || "/") + " · " + dest : (path.path || "/"));
    }
  }
  return out.join(", ");
}
function onCreate(form, go, work) {
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    setErr("");
    go.disabled = true;
    try {
      await work();
      await render();
    } catch (e) {
      setErr(e.message);
    }
    go.disabled = false;
  });
}

document.getElementById("login-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const err = document.getElementById("login-err");
  err.textContent = "";
  try {
    const data = await api("POST", "/identity/tokens", {
      name: document.getElementById("user").value.trim(),
      password: document.getElementById("pass").value,
    }, false);
    setToken(data.token);
    document.getElementById("pass").value = "";
    const who = data.caller || {};
    document.getElementById("who").textContent = (who.principal_name || "admin") + (who.project ? " · " + who.project : "");
    showApp();
    await render();
  } catch (e) {
    err.textContent = e.message === "invalid credentials"
      ? "Password was not accepted. Clear the box and paste it again. A password manager may have replaced it."
      : e.message;
  }
});
document.getElementById("logout").addEventListener("click", () => { showLogin(); });
document.querySelector("nav").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-view]");
  if (!b) return;
  current = b.dataset.view;
  openMachine = null;
  for (const n of document.querySelectorAll("nav button")) n.removeAttribute("aria-current");
  b.setAttribute("aria-current", "page");
  render();
});

function field(label, node) {
  const wrap = el("div");
  wrap.append(el("label", label), node);
  return wrap;
}

function simpleTable(cols, items) {
  const table = el("table");
  const head = el("tr");
  for (const c of cols) head.append(el("th", c[0]));
  const thead = el("thead");
  thead.append(head);
  table.append(thead);
  const body = el("tbody");
  for (const item of items) {
    const tr = el("tr");
    for (const c of cols) {
      const value = c[1](item);
      const td = el("td", show(value));
      if (c[0] === "Phase" || c[0] === "Power") td.className = "phase " + String(value || "").toLowerCase();
      tr.append(td);
    }
    body.append(tr);
  }
  if (!items.length) {
    const tr = el("tr");
    const td = el("td", "Nothing here yet.");
    td.colSpan = cols.length;
    tr.append(td);
    body.append(tr);
  }
  table.append(body);
  return table;
}

function line(k, v, phase) {
  const p = el("p");
  p.append(el("span", k, "k"));
  const val = el("span", show(v));
  if (phase) val.className = "phase " + String(v || "");
  p.append(val);
  return p;
}

function openConsole(card, id) {
  if (card.querySelector("canvas.screen")) return;
  const status = el("p", "Connecting", "sub");
  const canvas = el("canvas", null, "screen");
  canvas.tabIndex = 0;
  card.append(status, canvas);
  const ctx = canvas.getContext("2d");
  let ws = null;
  let buf = new Uint8Array(0);
  let off = 0;
  let stage = "version";
  let pf = null;
  let fbW = 0;
  let fbH = 0;
  let rectsLeft = 0;
  let rect = null;
  let rawLeft = 0;
  let pending = 0;
  let buttons = 0;

  function append(chunk) {
    if (off > 65536) {
      buf = buf.slice(off);
      off = 0;
    }
    const next = new Uint8Array(buf.length - off + chunk.length);
    next.set(buf.subarray(off), 0);
    next.set(chunk, buf.length - off);
    buf = next;
    off = 0;
  }
  function take(n) {
    if (buf.length - off < n) return null;
    const out = buf.subarray(off, off + n);
    off += n;
    return out;
  }
  function u16(a, o) { return (a[o] << 8) | a[o + 1]; }
  function u32(a, o) { return ((a[o] << 24) | (a[o + 1] << 16) | (a[o + 2] << 8) | a[o + 3]) >>> 0; }
  function i32(a, o) { return (a[o] << 24) | (a[o + 1] << 16) | (a[o + 2] << 8) | a[o + 3]; }
  function send(bytes) {
    if (ws && ws.readyState === 1) ws.send(bytes);
  }
  function fail(text) {
    status.textContent = text;
    stage = "dead";
    try { if (ws) ws.close(); } catch (e) {}
  }
  function requestFb(incremental) {
    const m = new Uint8Array(10);
    m[0] = 3;
    m[1] = incremental ? 1 : 0;
    m[6] = (fbW >> 8) & 255;
    m[7] = fbW & 255;
    m[8] = (fbH >> 8) & 255;
    m[9] = fbH & 255;
    send(m);
  }
  function paint(r, pixels) {
    const img = ctx.createImageData(r.w, r.h);
    const view = new DataView(pixels.buffer, pixels.byteOffset, pixels.byteLength);
    for (let i = 0; i < r.w * r.h; i++) {
      const v = pf.big ? view.getUint32(i * 4, false) : view.getUint32(i * 4, true);
      let red = (v >>> pf.redShift) & pf.redMax;
      let green = (v >>> pf.greenShift) & pf.greenMax;
      let blue = (v >>> pf.blueShift) & pf.blueMax;
      if (pf.redMax && pf.redMax !== 255) red = Math.round(red * 255 / pf.redMax);
      if (pf.greenMax && pf.greenMax !== 255) green = Math.round(green * 255 / pf.greenMax);
      if (pf.blueMax && pf.blueMax !== 255) blue = Math.round(blue * 255 / pf.blueMax);
      const o = i * 4;
      img.data[o] = red;
      img.data[o + 1] = green;
      img.data[o + 2] = blue;
      img.data[o + 3] = 255;
    }
    ctx.putImageData(img, r.x, r.y);
  }
  function pump() {
    while (stage !== "dead") {
      if (stage === "version") {
        const v = take(12);
        if (!v) return;
        let s = "";
        for (const b of v) s += String.fromCharCode(b);
        if (s !== "RFB 003.008\n") { fail("unexpected RFB version"); return; }
        send(new TextEncoder().encode("RFB 003.008\n"));
        stage = "sec-count";
        continue;
      }
      if (stage === "sec-count") {
        const n = take(1);
        if (!n) return;
        if (n[0] === 0) { fail("VNC refused the connection"); return; }
        pending = n[0];
        stage = "sec-types";
        continue;
      }
      if (stage === "sec-types") {
        const types = take(pending);
        if (!types) return;
        let none = false;
        for (const b of types) if (b === 1) none = true;
        if (!none) { fail("VNC security is not None"); return; }
        send(new Uint8Array([1]));
        stage = "sec-result";
        continue;
      }
      if (stage === "sec-result") {
        const r = take(4);
        if (!r) return;
        if (u32(r, 0) !== 0) { fail("VNC security rejected"); return; }
        send(new Uint8Array([1]));
        stage = "init";
        continue;
      }
      if (stage === "init") {
        const h = take(24);
        if (!h) return;
        fbW = u16(h, 0);
        fbH = u16(h, 2);
        if (h[4] !== 32) { fail("framebuffer is " + h[4] + " bpp"); return; }
        pf = {
          big: h[6] === 1,
          redMax: u16(h, 8),
          greenMax: u16(h, 10),
          blueMax: u16(h, 12),
          redShift: h[14],
          greenShift: h[15],
          blueShift: h[16],
        };
        pending = u32(h, 20);
        stage = "name";
        continue;
      }
      if (stage === "name") {
        const name = take(pending);
        if (!name) return;
        canvas.width = fbW;
        canvas.height = fbH;
        status.textContent = fbW + "×" + fbH;
        const enc = new Uint8Array(8);
        enc[0] = 2;
        enc[3] = 1;
        send(enc);
        requestFb(false);
        stage = "msg";
        continue;
      }
      if (stage === "msg") {
        const t = take(1);
        if (!t) return;
        if (t[0] === 0) { stage = "fbu"; continue; }
        if (t[0] === 2) continue;
        if (t[0] === 3) { stage = "cut"; continue; }
        fail("unknown server message " + t[0]);
        return;
      }
      if (stage === "fbu") {
        const h = take(3);
        if (!h) return;
        rectsLeft = u16(h, 1);
        if (!rectsLeft) { requestFb(true); stage = "msg"; continue; }
        stage = "rect";
        continue;
      }
      if (stage === "rect") {
        const h = take(12);
        if (!h) return;
        rect = { x: u16(h, 0), y: u16(h, 2), w: u16(h, 4), h: u16(h, 6), enc: i32(h, 8) };
        if (rect.enc !== 0) { fail("encoding " + rect.enc + " is not Raw"); return; }
        rawLeft = rect.w * rect.h * 4;
        stage = "raw";
        continue;
      }
      if (stage === "raw") {
        const pixels = take(rawLeft);
        if (!pixels) return;
        paint(rect, pixels);
        rectsLeft -= 1;
        if (rectsLeft > 0) stage = "rect";
        else { requestFb(true); stage = "msg"; }
        continue;
      }
      if (stage === "cut") {
        const h = take(7);
        if (!h) return;
        pending = u32(h, 3);
        stage = "cut-body";
        continue;
      }
      if (stage === "cut-body") {
        if (!take(pending)) return;
        stage = "msg";
        continue;
      }
      return;
    }
  }
  function pointer(ev, mask) {
    if (!fbW || stage === "dead") return;
    const box = canvas.getBoundingClientRect();
    if (!box.width || !box.height) return;
    const x = Math.max(0, Math.min(fbW - 1, Math.floor((ev.clientX - box.left) * (fbW / box.width))));
    const y = Math.max(0, Math.min(fbH - 1, Math.floor((ev.clientY - box.top) * (fbH / box.height))));
    const m = new Uint8Array(6);
    m[0] = 5;
    m[1] = mask & 255;
    m[2] = (x >> 8) & 255;
    m[3] = x & 255;
    m[4] = (y >> 8) & 255;
    m[5] = y & 255;
    send(m);
  }
  canvas.addEventListener("pointerdown", (ev) => {
    canvas.focus();
    ev.preventDefault();
    buttons |= (1 << ev.button);
    pointer(ev, buttons);
  });
  canvas.addEventListener("pointerup", (ev) => {
    buttons &= ~(1 << ev.button);
    pointer(ev, buttons);
  });
  canvas.addEventListener("pointermove", (ev) => { pointer(ev, buttons); });
  canvas.addEventListener("contextmenu", (ev) => ev.preventDefault());
  function keysym(ev) {
    const named = {
      Enter: 0xff0d, Backspace: 0xff08, Tab: 0xff09, Escape: 0xff1b,
      ArrowLeft: 0xff51, ArrowUp: 0xff52, ArrowRight: 0xff53, ArrowDown: 0xff54,
      Home: 0xff50, End: 0xff57, PageUp: 0xff55, PageDown: 0xff56,
      Insert: 0xff63, Delete: 0xffff, " ": 0x20,
      Shift: 0xffe1, Control: 0xffe3, Alt: 0xffe9, Meta: 0xffe7,
    };
    if (named[ev.key] != null) return named[ev.key];
    if (ev.key.length === 1) return ev.key.charCodeAt(0);
    return null;
  }
  function sendKey(k, down) {
    const m = new Uint8Array(8);
    m[0] = 4;
    m[1] = down;
    m[4] = (k >>> 24) & 255;
    m[5] = (k >>> 16) & 255;
    m[6] = (k >>> 8) & 255;
    m[7] = k & 255;
    send(m);
  }
  canvas.addEventListener("keydown", (ev) => {
    const k = keysym(ev);
    if (k == null) return;
    ev.preventDefault();
    sendKey(k, 1);
  });
  canvas.addEventListener("keyup", (ev) => {
    const k = keysym(ev);
    if (k == null) return;
    ev.preventDefault();
    sendKey(k, 0);
  });

  api("GET", "/compute/machines/" + encodeURIComponent(id) + "/console").then((data) => {
    const path = (data && data.websocket) || "";
    if (!path.includes("console/vnc")) {
      status.textContent = "console/vnc path missing";
      return;
    }
    const proto = location.protocol === "https:" ? "wss://" : "ws://";
    ws = new WebSocket(proto + location.host + path);
    ws.binaryType = "arraybuffer";
    ws.addEventListener("message", (ev) => {
      if (!(ev.data instanceof ArrayBuffer)) { fail("console frame was not binary"); return; }
      append(new Uint8Array(ev.data));
      pump();
    });
    ws.addEventListener("close", () => {
      if (stage !== "dead") status.textContent = "Console closed";
    });
    ws.addEventListener("error", () => { status.textContent = "Console connection failed"; });
  }).catch((e) => { status.textContent = e.message; });
}

async function renderMachine(id, gen) {
  const root = document.getElementById("view");
  root.replaceChildren();
  const tools = el("div"); tools.className = "tools";
  const back = el("button", "Back"); back.type = "button";
  back.addEventListener("click", () => { openMachine = null; render(); });
  const refresh = el("button", "Refresh"); refresh.type = "button";
  refresh.addEventListener("click", () => render());
  tools.append(back, el("h2", "Machine"), refresh);
  root.append(tools);
  let machine;
  try {
    machine = await api("GET", "/compute/machines/" + encodeURIComponent(id));
  } catch (e) {
    if (gen !== renderGen) return;
    setErr(e.message);
    return;
  }
  if (gen !== renderGen) return;
  let fips = [];
  let vols = [];
  const problems = [];
  try {
    fips = itemsOf(await api("GET", "/network/floating-ips"));
  } catch (e) { problems.push(e.message); }
  if (gen !== renderGen) return;
  try {
    const all = itemsOf(await api("GET", "/volume/volumes"));
    vols = all.filter(v => v.status && String(v.status.attached_to || "") === String(machine.id));
  } catch (e) { problems.push(e.message); }
  if (gen !== renderGen) return;
  if (problems.length) setErr(problems.join(" "));
  const card = el("div"); card.className = "detail";
  const addrs = ((machine.status && machine.status.addresses) || []).join(", ");
  card.append(
    line("Name", machine.name),
    line("ID", machine.id),
    line("Phase", machine.status && machine.status.phase, true),
    line("Power", machine.status && machine.status.power, true),
    line("Size", machine.spec && machine.spec.size),
    line("Image", machine.spec && machine.spec.image),
    line("Private addresses", addrs),
  );
  const matched = matchingFips(machine, fips);
  if (!matched.length) {
    card.append(line("Floating IP", ""), line("Fixed IP", ""));
  } else {
    for (const f of matched) {
      card.append(line("Floating IP", f.spec && f.spec.address));
      card.append(line("Fixed IP", f.status && f.status.fixed_ip));
    }
  }
  card.append(el("h3", "Volumes"));
  card.append(simpleTable([
    ["Name", v => v.name],
    ["GiB", v => v.spec && v.spec.size_gib],
    ["Device", v => v.status && v.status.device],
  ], vols));
  const actions = el("div"); actions.className = "tools";
  const screen = el("button", "Console"); screen.type = "button";
  screen.addEventListener("click", () => { openConsole(card, machine.id); });
  const reboot = el("button", "Reboot"); reboot.type = "button";
  const start = el("button", "Start"); start.type = "button"; start.className = "primary";
  const stop = el("button", "Stop"); stop.type = "button";
  const del = el("button", "Delete"); del.type = "button"; del.className = "danger";
  const mid = encodeURIComponent(machine.id);
  reboot.addEventListener("click", async () => {
    setErr("");
    try { await api("POST", "/compute/machines/" + mid + "/reboot"); await render(); }
    catch (e) { setErr(e.message); }
  });
  start.addEventListener("click", async () => {
    setErr("");
    try { await api("POST", "/compute/machines/" + mid + "/start"); await render(); }
    catch (e) { setErr(e.message); }
  });
  stop.addEventListener("click", async () => {
    setErr("");
    try { await api("POST", "/compute/machines/" + mid + "/stop"); await render(); }
    catch (e) { setErr(e.message); }
  });
  del.addEventListener("click", async () => {
    if (!confirm("Delete " + machine.name + "?")) return;
    setErr("");
    try {
      await api("DELETE", "/compute/machines/" + mid);
      openMachine = null;
      await render();
    } catch (e) { setErr(e.message); }
  });
  actions.append(screen, reboot, start, stop, del);
  card.append(actions);
  root.append(card);
  const phase = machine.status && machine.status.phase;
  if (["pending", "creating", "deleting"].includes(phase)) {
    timer = setInterval(() => {
      const viewEl = document.getElementById("view");
      if (viewEl.contains(document.activeElement)) return;
      render();
    }, 3000);
  }
}

async function renderDns(root, gen) {
  let zones = [];
  let records = [];
  const problems = [];
  try { zones = itemsOf(await api("GET", "/dns/zones")); }
  catch (e) { problems.push(e.message); }
  if (gen !== renderGen) return;
  try { records = itemsOf(await api("GET", "/dns/recordsets")); }
  catch (e) { problems.push(e.message); }
  if (gen !== renderGen) return;
  if (problems.length) setErr(problems.join(" "));
  root.append(el("h3", "Zones"));
  root.append(simpleTable([
    ["Name", i => i.name],
    ["Phase", i => i.status && i.status.phase],
    ["Apex", i => i.spec && i.spec.name],
  ], zones));
  root.append(el("h3", "Records"));
  root.append(simpleTable([
    ["Name", i => i.spec && i.spec.name],
    ["Type", i => i.spec && i.spec.type],
    ["Records", i => ((i.spec && i.spec.records) || []).join(", ")],
  ], records));
}

async function renderBalancers(root, gen) {
  let lbs = [];
  let listeners = [];
  let pools = [];
  const problems = [];
  try { lbs = itemsOf(await api("GET", "/balancers/balancers")); }
  catch (e) { problems.push(e.message); }
  if (gen !== renderGen) return;
  try { listeners = itemsOf(await api("GET", "/balancers/listeners")); }
  catch (e) { problems.push(e.message); }
  if (gen !== renderGen) return;
  try { pools = itemsOf(await api("GET", "/balancers/pools")); }
  catch (e) { problems.push(e.message); }
  if (gen !== renderGen) return;
  if (problems.length) setErr(problems.join(" "));
  root.append(el("h3", "Balancers"));
  root.append(simpleTable([
    ["Name", i => i.name],
    ["Phase", i => i.status && i.status.phase],
    ["VIP", i => (i.status && i.status.vip) || (i.spec && i.spec.vip_address) || ""],
    ["Network", i => i.spec && i.spec.vip_network],
  ], lbs));
  root.append(el("h3", "Listeners"));
  root.append(simpleTable([
    ["Name", i => i.name],
    ["Phase", i => i.status && i.status.phase],
    ["Protocol", i => protoText(i.spec && i.spec.protocol)],
    ["Port", i => i.spec && i.spec.port],
    ["Balancer", i => i.spec && i.spec.balancer],
  ], listeners));
  root.append(el("h3", "Pools"));
  root.append(simpleTable([
    ["Name", i => i.name],
    ["Phase", i => i.status && i.status.phase],
    ["Protocol", i => protoText(i.spec && i.spec.protocol)],
    ["Algorithm", i => i.spec && i.spec.algorithm],
    ["Members", i => i.status && i.status.members],
    ["Balancer", i => i.spec && i.spec.balancer],
  ], pools));
}

async function render() {
  const gen = ++renderGen;
  clearInterval(timer);
  const view = VIEWS[current];
  const root = document.getElementById("view");
  root.replaceChildren();
  document.getElementById("note").textContent = view.note || "";
  setErr("");
  if (current === "machines" && openMachine) {
    await renderMachine(openMachine, gen);
    return;
  }
  const tools = el("div"); tools.className = "tools";
  tools.append(el("h2", view.title));
  const refresh = el("button", "Refresh"); refresh.type = "button";
  refresh.addEventListener("click", () => render());
  tools.append(refresh);
  root.append(tools);
  if (current === "keys" && keyOnce) {
    const shown = keyOnce;
    keyOnce = null;
    root.append(el("p", "Copy this key secret now. It is not shown again. " + shown, "once"));
  }
  const form = createForm();
  if (form) root.append(form);
  if (view.multi === "dns") { await renderDns(root, gen); return; }
  if (view.multi === "balancers") { await renderBalancers(root, gen); return; }
  let page;
  try { page = await api("GET", view.path); }
  catch (e) {
    if (gen !== renderGen) return;
    setErr(e.message);
    return;
  }
  if (gen !== renderGen) return;
  if (current === "machines") {
    try {
      const fp = await api("GET", "/network/floating-ips");
      if (gen !== renderGen) return;
      machineFips = itemsOf(fp);
    } catch (e) {
      if (gen !== renderGen) return;
      machineFips = [];
      setErr(e.message);
    }
  }
  const items = itemsOf(page);
  root.append(simpleTable(view.cols, items));
  const table = root.lastElementChild;
  const body = table.querySelector("tbody");
  const rowAction = !!(view.actions || view.apply);
  if (rowAction || view.rules) {
    const head = table.querySelector("tr");
    if (rowAction) head.append(el("th", ""));
    const rows = body.querySelectorAll("tr");
    if (!items.length) {
      const td = rows[0] && rows[0].firstChild;
      if (td) td.colSpan = view.cols.length + (rowAction ? 1 : 0);
    } else {
      items.forEach((item, idx) => {
        const tr = rows[idx];
        if (!tr) return;
        if (current === "machines") {
          const nameCell = tr.firstChild;
          if (nameCell) {
            nameCell.replaceChildren();
            const btn = el("button", item.name || "—");
            btn.type = "button";
            btn.className = "linkish";
            btn.addEventListener("click", () => { openMachine = item.id; render(); });
            nameCell.append(btn);
          }
        }
        if (view.rules) {
          const rules = (item.spec && item.spec.rules) || [];
          const cell = tr.children[2];
          if (cell) {
            cell.replaceChildren(document.createTextNode(String(rules.length)));
            if (rules.length) {
              const ul = el("ul"); ul.className = "rules";
              for (const r of rules) ul.append(el("li", ruleLine(r)));
              cell.append(ul);
            }
          }
        }
        if (rowAction) {
          const td = el("td");
          if (view.actions) {
            const start = el("button", "Start"); start.type = "button";
            const stop = el("button", "Stop"); stop.type = "button";
            const del = el("button", "Delete"); del.type = "button"; del.className = "danger";
            start.addEventListener("click", async () => {
              setErr("");
              try { await api("POST", view.path + "/" + item.id + "/start"); await render(); }
              catch (e) { setErr(e.message); }
            });
            stop.addEventListener("click", async () => {
              setErr("");
              try { await api("POST", view.path + "/" + item.id + "/stop"); await render(); }
              catch (e) { setErr(e.message); }
            });
            del.addEventListener("click", async () => {
              if (!confirm("Delete " + item.name + "?")) return;
              setErr("");
              try { await api("DELETE", view.path + "/" + item.id); await render(); }
              catch (e) { setErr(e.message); }
            });
            td.append(start, document.createTextNode(" "), stop, document.createTextNode(" "), del);
          }
          if (view.apply) {
            const apply = el("button", "Apply"); apply.type = "button";
            apply.addEventListener("click", async () => {
              setErr("");
              apply.disabled = true;
              try {
                await api("POST", view.path + "/" + item.id + "/apply");
                await render();
              } catch (e) { setErr(e.message); }
              apply.disabled = false;
            });
            if (td.childNodes.length) td.append(document.createTextNode(" "));
            td.append(apply);
          }
          const history = (item.status && item.status.history) || [];
          if (view.rollback && history.length > 1) {
            const back = el("button", "Roll back"); back.type = "button";
            back.addEventListener("click", async () => {
              if (!confirm("Roll " + item.name + " back to its previous revision?")) return;
              setErr("");
              back.disabled = true;
              try {
                await api("POST", view.path + "/" + item.id + "/rollback");
                await render();
              } catch (e) { setErr(e.message); }
              back.disabled = false;
            });
            td.append(document.createTextNode(" "), back);
          }
          tr.append(td);
        }
      });
    }
  }
  if (current === "volumes") {
    try {
      const snaps = itemsOf(await api("GET", "/volume/snapshots"));
      if (gen !== renderGen) return;
      root.append(el("h3", "Snapshots"));
      root.append(simpleTable([
        ["Name", i => i.name],
        ["Phase", i => i.status && i.status.phase],
        ["Volume", i => i.spec && i.spec.volume],
        ["GiB", i => i.status && i.status.size_gib],
      ], snaps));
    } catch (e) {
      if (gen !== renderGen) return;
      setErr(e.message);
    }
  }
  if (current === "machines" && items.some(i => ["pending", "creating", "deleting"].includes(i.status && i.status.phase))) {
    timer = setInterval(() => {
      const viewEl = document.getElementById("view");
      if (viewEl.contains(document.activeElement)) return;
      render();
    }, 3000);
  }
}

if (token()) {
  api("GET", "/identity/tokens/self").then((who) => {
    document.getElementById("who").textContent = (who.principal_name || "signed in") + (who.project ? " · " + who.project : "");
    showApp();
    render();
  }).catch(() => showLogin());
}
</script>
