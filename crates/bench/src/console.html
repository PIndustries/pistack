<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiStack</title>
<style>
  :root {
    --bg: #04060a;
    --side: #070b10;
    --panel: #0c1218;
    --panel-2: #101821;
    --line: rgba(160, 190, 175, .16);
    --line-strong: rgba(160, 190, 175, .28);
    --text: #eafaef;
    --muted: #7e9b86;
    --accent: #34c759;
    --ok: #8df06a;
    --press: #159a3c;
    --ink: #04140a;
    --bad: #f0806e;
    --bad-bg: rgba(240, 128, 110, .12);
    --wait: #e6c35c;
    --field: #080d12;
    --hover: rgba(52, 199, 89, .08);
    --active: rgba(52, 199, 89, .16);
    --shadow: 0 8px 30px rgba(0, 0, 0, .35);
  }
  :root[data-theme="light"] {
    --bg: #f5f7f6;
    --side: #ffffff;
    --panel: #ffffff;
    --panel-2: #f0f3f1;
    --line: rgba(20, 40, 30, .12);
    --line-strong: rgba(20, 40, 30, .22);
    --text: #10201a;
    --muted: #5d6f66;
    --accent: #1f9d45;
    --ok: #17803a;
    --press: #17803a;
    --ink: #ffffff;
    --bad: #c2412d;
    --bad-bg: rgba(194, 65, 45, .08);
    --wait: #946a00;
    --field: #ffffff;
    --hover: rgba(31, 157, 69, .07);
    --active: rgba(31, 157, 69, .13);
    --shadow: 0 8px 30px rgba(20, 40, 30, .12);
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  html[data-theme="light"] { color-scheme: light; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea {
    font: inherit;
    color: inherit;
    background: var(--field);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 0.42rem 0.7rem;
  }
  button { cursor: pointer; background: var(--panel-2); transition: background .12s, border-color .12s; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--ink); border-color: transparent; font-weight: 650; }
  button.primary:active { background: var(--press); }
  button.danger { color: var(--bad); }
  button.danger:hover:not(:disabled) { border-color: var(--bad); background: var(--bad-bg); }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.ghost:hover:not(:disabled) { background: var(--hover); color: var(--text); border-color: transparent; }
  canvas.screen {
    width: 100%;
    height: auto;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 10px;
    display: block;
    margin-top: 0.8rem;
  }
  button.linkish {
    background: transparent;
    border-color: transparent;
    color: var(--ok);
    padding: 0;
    font-weight: 650;
    text-align: left;
  }
  button.linkish:hover:not(:disabled) { text-decoration: underline; border-color: transparent; }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible, input:focus, select:focus, textarea:focus {
    outline: 2px solid rgba(52, 199, 89, .55);
    outline-offset: 1px;
  }
  a { color: var(--accent); }
  /* display is only set when the section is shown. A plain display rule
     beats the hidden attribute, which left the login card on top of the
     console after sign-in. */
  #login:not([hidden]) {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background: radial-gradient(900px 480px at 50% -10%, rgba(52, 199, 89, .10), transparent 60%);
  }
  /* The pi tile, as on the P.Industries site. */
  .mark {
    display: grid;
    place-items: center;
    flex: none;
    width: 1.75rem;
    height: 1.75rem;
    border-radius: 0.5rem;
    background: linear-gradient(150deg, #8df06a, #159a3c);
    box-shadow: 0 0 16px rgba(75, 222, 128, .45);
    color: #04130a;
    font-size: 1.05rem;
    font-weight: 900;
    line-height: 1;
  }
  #login .mark { width: 2.4rem; height: 2.4rem; border-radius: 0.65rem; font-size: 1.4rem; }
  #login h1 { display: flex; align-items: center; gap: 0.7rem; }
  #login form, .card, form.create, .detail, .once, .tile, .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.25rem;
  }
  #login form { box-shadow: var(--shadow); }
  #login form, .card { width: min(400px, 100%); }
  #login button.primary { width: 100%; margin-top: 1rem; padding: 0.55rem; }
  h1 { font-size: 1.3rem; margin: 0 0 0.25rem; }
  h2, h3 { font-weight: 650; }
  h2 { font-size: 1.2rem; margin: 0; letter-spacing: -0.01em; }
  h3 { font-size: 0.82rem; margin: 1.4rem 0 0.5rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .sub { color: var(--muted); margin: 0 0 1rem; }
  label { display: block; margin: 0.7rem 0 0.25rem; color: var(--muted); font-size: 0.8rem; }
  input, select, textarea { width: 100%; }
  textarea { min-height: 4.5rem; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; }
  .row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: end; }
  .row > * { flex: 1; min-width: 8rem; }

  #shell:not([hidden]) { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  #side {
    background: var(--side);
    border-right: 1px solid var(--line);
    padding: 0.9rem 0.6rem 1.5rem;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 0.6rem; padding: 0.2rem 0.55rem 0.9rem; font-size: 1.02rem; }
  #nav-filter { margin-bottom: 0.7rem; font-size: 0.86rem; }
  nav button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    text-align: left;
    margin: 1px 0;
    padding: 0.36rem 0.55rem;
    background: transparent;
    border-color: transparent;
    border-radius: 7px;
    color: var(--muted);
  }
  nav button:hover:not(:disabled) { background: var(--hover); color: var(--text); border-color: transparent; }
  nav button[data-view][aria-current="page"] { background: var(--active); color: var(--text); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
  nav button[hidden] { display: none; }
  nav .count { font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  nav .group { margin-top: 0.55rem; }
  nav .group-head { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 650; padding: 0.3rem 0.55rem; }
  nav .group-head::after { content: "▾"; font-size: 0.7rem; transition: transform .12s; }
  nav .group-head[aria-expanded="false"]::after { transform: rotate(-90deg); }
  nav .group-items[hidden] { display: none; }

  #shell:not([hidden]) > div { min-width: 0; }
  header {
    display: flex; gap: 0.8rem; justify-content: space-between; align-items: center;
    padding: 0.6rem 1.4rem; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
  }
  .crumbs { display: flex; align-items: center; gap: 0.45rem; flex-shrink: 0; white-space: nowrap; }
  .crumbs span { color: var(--muted); }
  .crumbs span:not(:empty)::after { content: "/"; margin-left: 0.45rem; opacity: 0.6; }
  .head-tools { display: flex; align-items: center; gap: 0.5rem; }
  #filter { width: 13rem; font-size: 0.86rem; }
  .live { display: inline-flex; align-items: center; gap: 0.35rem; margin: 0; font-size: 0.8rem; white-space: nowrap; cursor: pointer; }
  .live input { width: auto; accent-color: var(--accent); }
  #who { color: var(--muted); font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 16rem; }
  #menu { display: none; }
  header button { white-space: nowrap; }
  main { padding: 1.3rem 1.4rem 3rem; min-width: 0; overflow-x: auto; }

  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 0.55rem 0.8rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--hover); }
  th { color: var(--muted); font-weight: 600; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; background: var(--panel-2); white-space: nowrap; }
  td button { padding: 0.22rem 0.55rem; font-size: 0.82rem; }
  td.empty { color: var(--muted); text-align: center; padding: 2rem 1rem; }
  .phase { text-transform: lowercase; white-space: nowrap; }
  .phase:not(:empty)::before { content: ""; display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: currentColor; margin-right: 0.45rem; vertical-align: 0.05em; opacity: 0.9; }
  .phase.ready, .phase.on, .phase.running, .phase.succeeded, .phase.ok, .phase.accepted { color: var(--ok); }
  .phase.error, .phase.off, .phase.failed, .phase.firing { color: var(--bad); }
  .phase.pending, .phase.creating, .phase.deleting, .phase.unknown { color: var(--wait); }
  .rules { margin: 0.25rem 0 0; padding-left: 1.1rem; color: var(--muted); }
  .detail { width: min(820px, 100%); }
  .detail p { margin: 0.3rem 0; }
  .detail .k { color: var(--muted); display: inline-block; min-width: 9.5rem; }
  .once { color: var(--ok); border-radius: 10px; padding: 0.7rem 0.9rem; margin: 0 0 1rem; word-break: break-all; }
  #err, #note, #login-err:not(:empty) { border-radius: 10px; padding: 0.6rem 0.9rem; margin: 0 0 1rem; }
  #err { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad); display: none; }
  #login-err:not(:empty) { background: var(--bad-bg); color: var(--bad); }
  #note { color: var(--muted); border-left: 3px solid var(--line-strong); border-radius: 0; padding: 0.1rem 0 0.1rem 0.8rem; max-width: 70ch; }
  #note:empty { display: none; }
  .tools { display: flex; gap: 0.5rem; align-items: center; margin: 0 0 1rem; flex-wrap: wrap; }
  .tools .grow { flex: 1; }
  .chip { font-size: 0.75rem; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 999px; padding: 0.05rem 0.55rem; font-variant-numeric: tabular-nums; }
  .chip:empty { display: none; }
  form.create { margin: 0 0 1.2rem; width: auto; }
  form.create p { color: var(--muted); font-size: 0.85rem; max-width: 80ch; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0.8rem; }
  button.tile { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; text-align: left; padding: 0.95rem 1rem; background: var(--panel); border-color: var(--line); min-height: 6.6rem; }
  button.tile:hover:not(:disabled) { background: var(--panel-2); }
  .tile .label { color: var(--muted); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; }
  .tile .value { font-size: 1.7rem; font-weight: 650; letter-spacing: -0.02em; line-height: 1.25; font-variant-numeric: tabular-nums; }
  .tile .value small { font-size: 0.85rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .tile .hint { color: var(--muted); font-size: 0.8rem; }
  .tile .hint.bad { color: var(--bad); }
  .meter { height: 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; margin: 0.45rem 0 0.3rem; border: 1px solid var(--line); }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .meter.high i { background: var(--wait); }
  .meter.full i { background: var(--bad); }
  td .meter { width: 5rem; display: inline-block; vertical-align: middle; margin: 0 0.5rem 0 0; }
  .panel td { white-space: nowrap; }
  .panel table.wrap td:last-child { white-space: normal; }
  .panel { padding: 0; overflow-x: auto; }
  .panel > p { margin: 0; padding: 1.4rem; color: var(--muted); text-align: center; }
  .panel table { border: 0; border-radius: 0; }
  .split { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 0 1.2rem; }

  /* Machine page and overview: header, tabs, charts, activity. */
  .crumb { background: none; border: 0; padding: 0; color: var(--muted); font-size: 0.86rem; cursor: pointer; }
  .crumb:hover:not(:disabled) { color: var(--text); border-color: transparent; }
  .mhead { display: flex; align-items: flex-start; gap: 1rem; flex-wrap: wrap; margin: 0.5rem 0 1.1rem; }
  .mhead .who { flex: 1; min-width: 14rem; }
  .mhead h2 { font-size: 1.55rem; display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; }
  .mhead .meta { color: var(--muted); margin: 0.35rem 0 0; font-size: 0.88rem; }
  .mhead .meta b { color: var(--text); font-weight: 500; }
  .mhead .acts { display: flex; gap: 0.45rem; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.16rem 0.6rem; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 0.74rem; font-weight: 600; letter-spacing: 0.02em; text-transform: lowercase; color: var(--muted); }
  .pill::before { content: ""; width: 0.45rem; height: 0.45rem; border-radius: 50%; background: currentColor; }
  .pill.ready, .pill.on, .pill.running, .pill.leader { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 9%, transparent); }
  .pill.error, .pill.failed, .pill.off { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: var(--bad-bg); }
  .pill.pending, .pill.creating, .pill.deleting, .pill.updating { color: var(--wait); border-color: color-mix(in srgb, var(--wait) 40%, transparent); }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0.8rem; margin: 0 0 1.2rem; }
  .chart { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0.85rem 1rem 0.7rem; min-width: 0; }
  .chart .label { color: var(--muted); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; }
  .chart .now { font-size: 1.3rem; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin: 0.15rem 0 0.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chart .now small { font-size: 0.8rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .chart .foot { color: var(--muted); font-size: 0.74rem; min-height: 1.1em; display: flex; gap: 0.8rem; flex-wrap: wrap; }
  .chart .foot i { font-style: normal; display: inline-flex; align-items: center; gap: 0.3rem; }
  .chart .foot i::before { content: ""; width: 0.6rem; height: 2px; background: var(--accent); }
  .chart .foot i.b::before { background: var(--wait); }
  .chart svg { display: block; width: 100%; height: 64px; margin: 0.35rem 0 0.3rem; overflow: visible; }
  .chart svg .area { fill: var(--accent); opacity: 0.13; stroke: none; }
  .chart svg .ln { fill: none; stroke: var(--accent); stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .chart svg .ln.b { stroke: var(--wait); }
  .chart svg .base { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .chart .none { height: 64px; margin: 0.35rem 0 0.3rem; display: grid; place-items: center; color: var(--muted); font-size: 0.8rem; border: 1px dashed var(--line); border-radius: 8px; text-align: center; padding: 0 0.5rem; }
  .tabs { display: flex; gap: 0.2rem; border-bottom: 1px solid var(--line); margin: 0 0 1rem; overflow-x: auto; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 0.55rem 0.85rem; color: var(--muted); font-weight: 550; white-space: nowrap; }
  .tabs button:hover:not(:disabled) { color: var(--text); border-color: transparent; border-bottom-color: var(--line-strong); }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0 2rem; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0.6rem 1.1rem; }
  .kv p { display: flex; gap: 1rem; margin: 0; padding: 0.5rem 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .kv .k { color: var(--muted); flex: 0 0 8.5rem; }
  .kv .v { min-width: 0; overflow-wrap: anywhere; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.86em; }
  .strip { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0.7rem 0.9rem; margin: 0.8rem 0 1.2rem; }
  .strip .name { color: var(--muted); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; margin-right: 0.4rem; }
  .strip .srv { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0.65rem; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); font-size: 0.84rem; }
  .strip .facts.bad { color: var(--bad); }
  .strip .facts { margin-left: auto; color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li { display: flex; gap: 0.8rem; align-items: baseline; padding: 0.6rem 1rem; border-bottom: 1px solid var(--line); min-width: 0; }
  .feed li:last-child { border-bottom: 0; }
  .feed .when { color: var(--muted); flex: 0 0 4.6rem; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .feed .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feed .what b { font-weight: 600; }
  .feed .code { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .feed li.bad .code, .feed li.bad .what { color: var(--bad); }
  #view > h3:first-of-type { margin-top: 0; }

  @media (max-width: 860px) {
    #login:not([hidden]) { padding: 1rem; }
    #shell:not([hidden]) { grid-template-columns: minmax(0, 1fr); }
    #side { position: fixed; z-index: 20; width: 260px; transform: translateX(-100%); transition: transform .16s; box-shadow: var(--shadow); }
    #shell.nav-open #side { transform: none; }
    #menu { display: inline-block; }
    header { padding: 0.55rem 0.8rem; }
    main { padding: 1rem 0.8rem 3rem; }
    #filter { width: 100%; min-width: 4rem; }
    .head-tools { min-width: 0; }
    #who, .live span { display: none; }
  }
</style>
</head>
<body>
<section id="login">
  <form id="login-form" autocomplete="off" onsubmit="event.preventDefault()">
    <h1><span class="mark" aria-hidden="true">π</span>PiStack</h1>
    <p class="sub">Sign in to this cloud. The token stays in this tab.</p>
    <label for="user">Name</label>
    <input id="user" name="name" autocomplete="username" value="admin" required>
    <label for="pass">Password</label>
    <input id="pass" name="password" type="password" autocomplete="off" spellcheck="false" required>
    <p id="login-err"></p>
    <button class="primary" type="submit">Sign in</button>
  </form>
</section>
<div id="shell" hidden>
  <aside id="side">
    <div class="brand"><span class="mark" aria-hidden="true">π</span><strong>PiStack</strong></div>
    <input id="nav-filter" type="search" placeholder="Jump to…  ( / )" aria-label="Filter the navigation" autocomplete="off">
    <nav>
      <button type="button" data-view="overview" aria-current="page">Overview</button>
      <div class="group" data-group="Compute">
        <button type="button" class="group-head" aria-expanded="true">Compute</button>
        <div class="group-items">
          <button type="button" data-view="machines">Machines</button>
          <button type="button" data-view="hosts">Hosts</button>
          <button type="button" data-view="images">Images</button>
        </div>
      </div>
      <div class="group" data-group="Network">
        <button type="button" class="group-head" aria-expanded="true">Network</button>
        <div class="group-items">
          <button type="button" data-view="networks">Networks</button>
          <button type="button" data-view="subnets">Subnets</button>
          <button type="button" data-view="ports">Ports</button>
          <button type="button" data-view="routers">Routers</button>
          <button type="button" data-view="security">Security groups</button>
          <button type="button" data-view="fips">Floating IPs</button>
          <button type="button" data-view="balancers">Load balancers</button>
          <button type="button" data-view="dns">DNS</button>
        </div>
      </div>
      <div class="group" data-group="Storage">
        <button type="button" class="group-head" aria-expanded="true">Storage</button>
        <div class="group-items">
          <button type="button" data-view="volumes">Volumes</button>
          <button type="button" data-view="buckets">Buckets</button>
          <button type="button" data-view="shares">Shares</button>
        </div>
      </div>
      <div class="group" data-group="Workloads">
        <button type="button" class="group-head" aria-expanded="true">Workloads</button>
        <div class="group-items">
          <button type="button" data-view="pods">Pods</button>
          <button type="button" data-view="deployments">Deployments</button>
          <button type="button" data-view="statefulsets">StatefulSets</button>
          <button type="button" data-view="daemonsets">DaemonSets</button>
          <button type="button" data-view="autoscalers">Autoscalers</button>
          <button type="button" data-view="services">Services</button>
          <button type="button" data-view="jobs">Jobs</button>

let current = "overview";
let timer = 0;
// Row counts shown next to each navigation entry, by view name.
const counts = {};
// Which create forms are open, by view name.
const formOpen = {};
let lastErr = "";
let readOnly = false;
let renderGen = 0;
let openMachine = null;
let machineFips = [];
// One-time key secret. Shown in the DOM, then dropped. Not stored.
let keyOnce = null;

function el(tag, text, cls) {
  const n = document.createElement(tag);
  if (text != null) n.textContent = text;
  if (cls) n.className = cls;
  return n;
}
function token() { return sessionStorage.getItem("pistack.token") || ""; }
function setToken(t) { sessionStorage.setItem("pistack.token", t); }
function clearToken() { sessionStorage.removeItem("pistack.token"); }

async function api(method, path, body, auth) {
  const headers = {};
  if (auth !== false && token()) headers.Authorization = "Bearer " + token();
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const res = await fetch(path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
  const text = await res.text();
  let data = null;
  if (text) {
    try { data = JSON.parse(text); } catch (e) { data = { error: { message: text.slice(0, 200) } }; }
  }
  if (res.status === 401 && auth !== false) { showLogin(); throw new Error("session ended"); }
  if (!res.ok) throw new Error((data && data.error && data.error.message) || res.statusText);
  // A change went through: the create form has done its job.
  if (method !== "GET") formOpen[current] = false;
  return data;
}

function showLogin() {
  clearToken();
  keyOnce = null;
  openMachine = null;
  document.getElementById("shell").hidden = true;
  document.getElementById("login").hidden = false;
}
function showApp() {
  document.getElementById("login").hidden = true;
  document.getElementById("shell").hidden = false;
}
function setErr(msg) {
  const n = document.getElementById("err");
  lastErr = msg || "";
  n.style.display = msg ? "block" : "none";
  n.textContent = msg || "";
}
function option(value, label) {
  const o = el("option", label == null ? value : label);
  o.value = value;
  return o;
}
function yesNo(v) {
  if (v == null || v === "") return "";
  return v ? "yes" : "no";
}
function show(value) {
  return value == null || value === "" ? "—" : String(value);
}
function bareAddr(value) {
  const s = String(value == null ? "" : value).trim();
  const i = s.indexOf("/");
  return i === -1 ? s : s.slice(0, i).trim();
}
function matchingFips(machine, fips) {
  const addrs = {};
  for (const a of (machine.status && machine.status.addresses) || []) {
    addrs[String(a)] = true;
    const bare = bareAddr(a);
    if (bare) addrs[bare] = true;
  }
  return (fips || []).filter(f => {
    const fixed = f.status && f.status.fixed_ip;
    if (!fixed) return false;
    return addrs[String(fixed)] || addrs[bareAddr(fixed)];
  });
}
function ruleLine(r) {
  const dir = r.direction || "—";
  const proto = r.protocol || "any";
  let ports = "any";
  if (r.port_range && r.port_range.min != null && r.port_range.max != null) {
    ports = String(r.port_range.min) === String(r.port_range.max)
      ? String(r.port_range.min)
      : String(r.port_range.min) + "-" + String(r.port_range.max);
  }
  let remote = "any";
  if (r.remote && typeof r.remote === "object") {
    if (r.remote.cidr) remote = String(r.remote.cidr);
    else if (r.remote.group) remote = String(r.remote.group);
  } else if (typeof r.remote === "string" && r.remote) {
    remote = r.remote;
  }
  return dir + " · " + proto + " · " + ports + " · " + remote;
}
function protoText(p) {
  if (p == null || p === "") return "";
  if (typeof p === "string") return p;
  if (p.type) return String(p.type);
  return "";
}
function itemsOf(page) {
  return (page && page.items) || [];
}
function num(obj, key) {
  if (!obj || obj[key] == null || obj[key] === "") return "";
  return obj[key];
}
function intField(value, label, min, max) {
  const n = Number(String(value).trim());
  if (!Number.isInteger(n) || n < min || (max != null && n > max)) {
    throw new Error(max == null
      ? label + " must be an integer >= " + min
      : label + " must be an integer from " + min + " to " + max);
  }
  return n;
}
function containerImages(spec) {
  return ((spec && spec.containers) || []).map(c => c.image).filter(Boolean).join(", ");
}
function templateImages(item) {
  const template = item.spec && item.spec.template;
  return containerImages(template && template.spec);
}
function selectorText(sel) {
  if (!sel || typeof sel !== "object") return "";
  return Object.keys(sel).map(k => k + "=" + sel[k]).join(", ");
}
function accessText(item) {
  return ((item.spec && item.spec.access) || []).map(a => {
    const who = a.cidr || a.principal || "";
    const mode = a.mode || "";
    return mode ? who + " " + mode : who;
  }).filter(Boolean).join(", ");
}
function ingressHosts(item) {
  return ((item.spec && item.spec.rules) || []).map(r => r.host).filter(Boolean).join(", ");
}
function ingressPaths(item) {
  const out = [];
  for (const rule of (item.spec && item.spec.rules) || []) {
    for (const path of rule.paths || []) {
      const backend = path.backend || {};
      const dest = backend.service ? backend.service + ":" + backend.port : "";
      out.push(dest ? (path.path || "/") + " · " + dest : (path.path || "/"));
    }
  }
  return out.join(", ");
}
function onCreate(form, go, work) {
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    setErr("");
    go.disabled = true;
    try {
      await work();
      await render();
    } catch (e) {
      setErr(e.message);
    }
    go.disabled = false;
  });
}

document.getElementById("login-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const err = document.getElementById("login-err");
  err.textContent = "";
  try {
    const data = await api("POST", "/identity/tokens", {
      name: document.getElementById("user").value.trim(),
      password: document.getElementById("pass").value,
    }, false);
    setToken(data.token);
    document.getElementById("pass").value = "";
    setWho(data.caller || {}, "admin");
    showApp();
    go(hashView(), true);
    loadCounts();
  } catch (e) {
    err.textContent = e.message === "invalid credentials"
      ? "Password was not accepted. Clear the box and paste it again. A password manager may have replaced it."
      : e.message;
  }
});
document.getElementById("logout").addEventListener("click", () => { showLogin(); });
function setWho(who, fallback) {
  const roles = who.roles || [];
  readOnly = roles.length > 0 && !roles.includes("admin") && !roles.includes("member");
  const node = document.getElementById("who");
  node.textContent = (who.principal_name || fallback) + (readOnly ? " · read-only" : "");
  node.title = who.project ? "Project " + who.project : "";
}

// ---- navigation -----------------------------------------------------------

function navButton(view) {
  return document.querySelector('nav button[data-view="' + view + '"]');
}
function go(view, fromHash) {
  if (!VIEWS[view]) view = "overview";
  current = view;
  openMachine = null;
  for (const n of document.querySelectorAll("nav button[data-view]")) n.removeAttribute("aria-current");
  const b = navButton(view);
  let group = "";
  if (b) {
    b.setAttribute("aria-current", "page");
    const g = b.closest(".group");
    if (g) { group = g.dataset.group; setGroup(g, true); }
  }
  document.getElementById("crumb-group").textContent = group;
  document.getElementById("crumb-title").textContent = VIEWS[view].title;
  document.title = VIEWS[view].title + " · PiStack";
  document.getElementById("filter").value = "";
  document.getElementById("shell").classList.remove("nav-open");
  if (!fromHash && location.hash !== "#/" + view) history.pushState(null, "", "#/" + view);
  render();
}
function hashView() {
  const v = location.hash.replace(/^#\/?/, "");
  return VIEWS[v] ? v : "overview";
}
window.addEventListener("popstate", () => { if (token()) go(hashView(), true); });

function storedGroups() {
  try { return JSON.parse(localStorage.getItem("pistack.nav") || "{}") || {}; } catch (e) { return {}; }
}
function setGroup(g, open, remember) {
  g.querySelector(".group-head").setAttribute("aria-expanded", String(open));
  g.querySelector(".group-items").hidden = !open;
  if (!remember) return;
  const all = storedGroups();
  all[g.dataset.group] = open;
  try { localStorage.setItem("pistack.nav", JSON.stringify(all)); } catch (e) { /* private window */ }
}
(function restoreGroups() {
  const all = storedGroups();
  for (const g of document.querySelectorAll("nav .group")) {
    const open = g.dataset.group in all ? all[g.dataset.group] : g.dataset.group === "Compute";
    if (!open) setGroup(g, false);
  }
})();
document.querySelector("nav").addEventListener("click", (ev) => {
  const head = ev.target.closest(".group-head");
  if (head) {
    setGroup(head.parentNode, head.getAttribute("aria-expanded") !== "true", true);
    return;
  }
  const b = ev.target.closest("button[data-view]");
  if (b) go(b.dataset.view);
});

});

// Typing in the box above the navigation narrows it. Enter opens the first
// match, and "/" anywhere outside a field puts the cursor there.
const navFilter = document.getElementById("nav-filter");
function filterNav() {
  const q = navFilter.value.trim().toLowerCase();
  const stored = storedGroups();
  for (const g of document.querySelectorAll("nav .group")) {
    let any = false;
    for (const b of g.querySelectorAll("button[data-view]")) {
      const hit = !q || b.firstChild.textContent.toLowerCase().includes(q) || g.dataset.group.toLowerCase().includes(q);
      b.hidden = !hit;
      any = any || hit;
    }
    g.hidden = !any;
    setGroup(g, q ? any : (g.dataset.group in stored ? stored[g.dataset.group] : g.dataset.group === "Compute"));
  }
  const cur = navButton(current);
  if (!q && cur && cur.closest(".group")) setGroup(cur.closest(".group"), true);
}
navFilter.addEventListener("input", filterNav);
navFilter.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") { navFilter.value = ""; filterNav(); navFilter.blur(); return; }
  if (ev.key !== "Enter") return;
  const first = [...document.querySelectorAll("nav .group button[data-view]")].find(b => !b.hidden);
  if (!first || !navFilter.value.trim()) return;
  navFilter.value = "";
  filterNav();
  go(first.dataset.view);
});
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "/" || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const t = ev.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
  if (document.getElementById("shell").hidden) return;
  ev.preventDefault();
  navFilter.focus();
});

function setCount(view, n) {
  counts[view] = n;
  const b = navButton(view);
  if (!b) return;
  let c = b.querySelector(".count");
  if (!c) { c = el("span", null, "count"); b.append(c); }
  c.textContent = n ? String(n) : "";
}
// One pass over every list after sign-in, a few at a time, so the
// navigation shows what the cloud holds without opening each page.
async function loadCounts() {
  const names = Object.keys(VIEWS).filter(v => VIEWS[v].path);
  const next = async () => {
    while (names.length) {
      const v = names.shift();
      try { setCount(v, itemsOf(await api("GET", VIEWS[v].path)).length); }
      catch (e) { /* a module that is off, or a list this role cannot read */ }
      if (!token()) return;
    }
  };
  await Promise.all([next(), next(), next(), next()]);
}

// A reload must not take anything out from under the user: not a form
// they are filling in, a one-time secret, or a machine's console.
setInterval(() => {

function setTheme(name) {

}

function shortId(id) {
  const m = /^([a-z]+)-[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{4}([0-9a-f]{8})$/.exec(String(id || ""));
  return m ? m[1] + "-" + m[2] : String(id || "");
}
// Long ids inside a message, cut to the short form pi prints.
function shortIds(text) {
  return String(text || "").replace(/\b([a-z]+)-[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{4}([0-9a-f]{8})\b/g, "$1-$2");
}
function ago(ts) {
  const t = Date.parse(ts);
  if (!t) return "";
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 172800) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}
function fmtBytes(n) {
  n = Number(n) || 0;
  const units = ["B", "KiB", "MiB", "GiB", "TiB"];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return (i === 0 || n >= 100 ? Math.round(n) : Math.round(n * 10) / 10) + " " + units[i];
}
function fmtNum(n) {
  n = Number(n) || 0;
  return n >= 100 ? String(Math.round(n)) : n >= 10 ? String(Math.round(n * 10) / 10) : String(Math.round(n * 100) / 100);
}

// A series key is `name{label="value",...}`.
function parseSeries(key) {
  const i = key.indexOf("{");
  const out = { name: i < 0 ? key : key.slice(0, i), labels: {} };
  if (i >= 0) {
    const re = /(\w+)="((?:[^"\\]|\\.)*)"/g;
    let m;
    while ((m = re.exec(key.slice(i)))) out.labels[m[1]] = m[2];
  }
  return out;
}
// The server keeps the last points of every series. One read serves every
// chart on the page for a while.
let sampleCache = { at: 0, rows: [] };
async function usageSamples() {
  if (Date.now() - sampleCache.at < 15000) return sampleCache.rows;
  const raw = await api("GET", "/gauge/samples");
  const rows = (Array.isArray(raw) ? raw : itemsOf(raw)).map((s) => {
    const k = parseSeries(s.metric);
    return { key: s.metric, name: k.name, labels: k.labels, t: Date.parse(s.timestamp), v: Number(s.value) };
  }).filter(r => r.t);
  sampleCache = { at: Date.now(), rows };
  return rows;
}
// Points of every series called `name` that `keep` accepts, by series.
function seriesOf(rows, name, keep) {
  const by = new Map();
  for (const r of rows) {
    if (r.name !== name || (keep && !keep(r.labels))) continue;
    if (!by.has(r.key)) by.set(r.key, []);
    by.get(r.key).push({ t: r.t, v: r.v });
  }
  for (const pts of by.values()) pts.sort((a, b) => a.t - b.t);
  return [...by.values()];
}
// A counter's points as a rate per second. A counter that went down was
// reset, and that step is left out.
function asRate(pts) {
  const out = [];
  for (let i = 1; i < pts.length; i++) {
    const dt = (pts[i].t - pts[i - 1].t) / 1000;
    const dv = pts[i].v - pts[i - 1].v;
    if (dt > 0 && dv >= 0) out.push({ t: pts[i].t, v: dv / dt });
  }
  return out;
}
// Several series added up, in steps of fifteen seconds.
function sumSeries(list) {
  const STEP = 15000;
  const buckets = new Map();
  list.forEach((pts, idx) => {
    for (const p of pts) {
      const b = Math.round(p.t / STEP) * STEP;
      if (!buckets.has(b)) buckets.set(b, new Map());
      buckets.get(b).set(idx, p.v);
    }
  });
  return [...buckets.entries()].sort((a, b) => a[0] - b[0])
    .map(([t, vals]) => ({ t, v: [...vals.values()].reduce((n, v) => n + v, 0) }));
}
function lastOf(pts) { return pts.length ? pts[pts.length - 1].v : null; }

function svgEl(tag, attrs) {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
// One or two lines over the same span of time. The first gets an area.
function sparkline(lines, ceiling) {
  const W = 300, H = 64;
  const all = lines.flat();
  if (all.length < 2) return null;
  const t0 = Math.min(...all.map(p => p.t));
  const t1 = Math.max(...all.map(p => p.t));
  const top = Math.max(ceiling || 0, ...all.map(p => p.v)) || 1;
  const x = t => (t1 === t0 ? W : (t - t0) / (t1 - t0) * W);
  const y = v => H - 1 - (v / top) * (H - 5);
  const svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, preserveAspectRatio: "none", role: "img" });
  svg.append(svgEl("line", { class: "base", x1: 0, x2: W, y1: H - 0.5, y2: H - 0.5 }));
  lines.forEach((pts, idx) => {
    if (pts.length < 2) return;
    const d = pts.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
    if (idx === 0) {
      svg.append(svgEl("path", { class: "area", d: d + " L" + x(pts[pts.length - 1].t).toFixed(1) + " " + H + " L" + x(pts[0].t).toFixed(1) + " " + H + " Z" }));
    }
    svg.append(svgEl("path", { class: idx ? "ln b" : "ln", d }));
  });
  return svg;
}
// A card with a name, the value now and the line behind it. `draw` is
// called again whenever there are new points.
function chartCard(label) {
  const node = el("div", null, "chart");
  const now = el("div", "", "now");
  const plot = el("div");
  const foot = el("div", "", "foot");
  node.append(el("div", label, "label"), now, plot, foot);
  return {
    node,
    draw(value, unit, lines, opts) {
      opts = opts || {};
      now.replaceChildren(value === null || value === undefined ? "—" : String(value));
      if (unit) { now.append(" "); now.append(el("small", unit)); }
      const svg = sparkline(lines, opts.ceiling);
      if (svg) { svg.setAttribute("aria-label", label + ", last minutes"); plot.replaceChildren(svg); }
      else plot.replaceChildren(el("div", opts.empty || "No samples yet", "none"));
      foot.replaceChildren();
      for (const [i, text] of (opts.legend || []).entries()) foot.append(el("i", text, i ? "b" : ""));
      if (opts.note) foot.append(el("span", opts.note));
    },
  };
}

  const p = el("p");
  p.append(el("span", k, "k"));
  const val = el("span", null, mono ? "v mono" : "v");
  if (v instanceof Node) val.append(v); else val.textContent = show(v);
  p.append(val);
  return p;
}

function openConsole(card, id) {
  if (card.querySelector("canvas.screen")) return;
  const status = el("p", "Connecting", "sub");
  const canvas = el("canvas", null, "screen");
  canvas.tabIndex = 0;
  card.append(status, canvas);
  const ctx = canvas.getContext("2d");
  let ws = null;
  let buf = new Uint8Array(0);
  let off = 0;
  let stage = "version";
  let pf = null;
  let fbW = 0;
  let fbH = 0;
  let rectsLeft = 0;
  let rect = null;
  let rawLeft = 0;
  let pending = 0;
  let buttons = 0;

  function append(chunk) {
    if (off > 65536) {
      buf = buf.slice(off);
      off = 0;
    }
    const next = new Uint8Array(buf.length - off + chunk.length);
    next.set(buf.subarray(off), 0);
    next.set(chunk, buf.length - off);
    buf = next;
    off = 0;
  }
  function take(n) {
    if (buf.length - off < n) return null;
    const out = buf.subarray(off, off + n);
    off += n;
    return out;
  }
  function u16(a, o) { return (a[o] << 8) | a[o + 1]; }
  function u32(a, o) { return ((a[o] << 24) | (a[o + 1] << 16) | (a[o + 2] << 8) | a[o + 3]) >>> 0; }
  function i32(a, o) { return (a[o] << 24) | (a[o + 1] << 16) | (a[o + 2] << 8) | a[o + 3]; }
  function send(bytes) {
    if (ws && ws.readyState === 1) ws.send(bytes);
  }
  function fail(text) {
    status.textContent = text;
    stage = "dead";
    try { if (ws) ws.close(); } catch (e) {}
  }
  function requestFb(incremental) {
    const m = new Uint8Array(10);
    m[0] = 3;
    m[1] = incremental ? 1 : 0;
    m[6] = (fbW >> 8) & 255;
    m[7] = fbW & 255;
    m[8] = (fbH >> 8) & 255;
    m[9] = fbH & 255;
    send(m);
  }
  function paint(r, pixels) {
    const img = ctx.createImageData(r.w, r.h);
    const view = new DataView(pixels.buffer, pixels.byteOffset, pixels.byteLength);
    for (let i = 0; i < r.w * r.h; i++) {
      const v = pf.big ? view.getUint32(i * 4, false) : view.getUint32(i * 4, true);
      let red = (v >>> pf.redShift) & pf.redMax;
      let green = (v >>> pf.greenShift) & pf.greenMax;
      let blue = (v >>> pf.blueShift) & pf.blueMax;
      if (pf.redMax && pf.redMax !== 255) red = Math.round(red * 255 / pf.redMax);
      if (pf.greenMax && pf.greenMax !== 255) green = Math.round(green * 255 / pf.greenMax);
      if (pf.blueMax && pf.blueMax !== 255) blue = Math.round(blue * 255 / pf.blueMax);
      const o = i * 4;
      img.data[o] = red;
      img.data[o + 1] = green;
      img.data[o + 2] = blue;
      img.data[o + 3] = 255;
    }
    ctx.putImageData(img, r.x, r.y);
  }
  function pump() {
    while (stage !== "dead") {
      if (stage === "version") {
        const v = take(12);
        if (!v) return;
        let s = "";
        for (const b of v) s += String.fromCharCode(b);
        if (s !== "RFB 003.008\n") { fail("unexpected RFB version"); return; }
        send(new TextEncoder().encode("RFB 003.008\n"));
        stage = "sec-count";
        continue;
      }
      if (stage === "sec-count") {
        const n = take(1);
        if (!n) return;
        if (n[0] === 0) { fail("VNC refused the connection"); return; }
        pending = n[0];
        stage = "sec-types";
        continue;
      }
      if (stage === "sec-types") {
        const types = take(pending);
        if (!types) return;
        let none = false;
        for (const b of types) if (b === 1) none = true;
        if (!none) { fail("VNC security is not None"); return; }
        send(new Uint8Array([1]));
        stage = "sec-result";
        continue;
      }
      if (stage === "sec-result") {
        const r = take(4);
        if (!r) return;
        if (u32(r, 0) !== 0) { fail("VNC security rejected"); return; }
        send(new Uint8Array([1]));
        stage = "init";
        continue;
      }
      if (stage === "init") {
        const h = take(24);
        if (!h) return;
        fbW = u16(h, 0);
        fbH = u16(h, 2);
        if (h[4] !== 32) { fail("framebuffer is " + h[4] + " bpp"); return; }
        pf = {
          big: h[6] === 1,
          redMax: u16(h, 8),
          greenMax: u16(h, 10),
          blueMax: u16(h, 12),
          redShift: h[14],
          greenShift: h[15],
          blueShift: h[16],
        };
        pending = u32(h, 20);
        stage = "name";
        continue;
      }
      if (stage === "name") {
        const name = take(pending);
        if (!name) return;
        canvas.width = fbW;
        canvas.height = fbH;
        status.textContent = fbW + "×" + fbH;
        const enc = new Uint8Array(8);
        enc[0] = 2;
        enc[3] = 1;
        send(enc);
        requestFb(false);
        stage = "msg";
        continue;
      }
      if (stage === "msg") {
        const t = take(1);
        if (!t) return;
        if (t[0] === 0) { stage = "fbu"; continue; }
        if (t[0] === 2) continue;
        if (t[0] === 3) { stage = "cut"; continue; }
        fail("unknown server message " + t[0]);
        return;
      }
      if (stage === "fbu") {
        const h = take(3);
        if (!h) return;
        rectsLeft = u16(h, 1);
        if (!rectsLeft) { requestFb(true); stage = "msg"; continue; }
        stage = "rect";
        continue;
      }
      if (stage === "rect") {
        const h = take(12);
        if (!h) return;
        rect = { x: u16(h, 0), y: u16(h, 2), w: u16(h, 4), h: u16(h, 6), enc: i32(h, 8) };
        if (rect.enc !== 0) { fail("encoding " + rect.enc + " is not Raw"); return; }
        rawLeft = rect.w * rect.h * 4;
        stage = "raw";
        continue;
      }
      if (stage === "raw") {
        const pixels = take(rawLeft);
        if (!pixels) return;
        paint(rect, pixels);
        rectsLeft -= 1;
        if (rectsLeft > 0) stage = "rect";
        else { requestFb(true); stage = "msg"; }
        continue;
      }
      if (stage === "cut") {
        const h = take(7);
        if (!h) return;
        pending = u32(h, 3);
        stage = "cut-body";
        continue;
      }
      if (stage === "cut-body") {
        if (!take(pending)) return;
        stage = "msg";
        continue;
      }
      return;
    }
  }
  function pointer(ev, mask) {
    if (!fbW || stage === "dead") return;
    const box = canvas.getBoundingClientRect();
    if (!box.width || !box.height) return;
    const x = Math.max(0, Math.min(fbW - 1, Math.floor((ev.clientX - box.left) * (fbW / box.width))));
    const y = Math.max(0, Math.min(fbH - 1, Math.floor((ev.clientY - box.top) * (fbH / box.height))));
    const m = new Uint8Array(6);
    m[0] = 5;
    m[1] = mask & 255;
    m[2] = (x >> 8) & 255;
    m[3] = x & 255;
    m[4] = (y >> 8) & 255;
    m[5] = y & 255;
    send(m);
  }
  canvas.addEventListener("pointerdown", (ev) => {
    canvas.focus();
    ev.preventDefault();
    buttons |= (1 << ev.button);
    pointer(ev, buttons);
  });
  canvas.addEventListener("pointerup", (ev) => {
    buttons &= ~(1 << ev.button);
    pointer(ev, buttons);
  });
  canvas.addEventListener("pointermove", (ev) => { pointer(ev, buttons); });
  canvas.addEventListener("contextmenu", (ev) => ev.preventDefault());
  function keysym(ev) {
    const named = {
      Enter: 0xff0d, Backspace: 0xff08, Tab: 0xff09, Escape: 0xff1b,
      ArrowLeft: 0xff51, ArrowUp: 0xff52, ArrowRight: 0xff53, ArrowDown: 0xff54,
      Home: 0xff50, End: 0xff57, PageUp: 0xff55, PageDown: 0xff56,
      Insert: 0xff63, Delete: 0xffff, " ": 0x20,
      Shift: 0xffe1, Control: 0xffe3, Alt: 0xffe9, Meta: 0xffe7,
    };
    if (named[ev.key] != null) return named[ev.key];
    if (ev.key.length === 1) return ev.key.charCodeAt(0);
    return null;
  }
  function sendKey(k, down) {
    const m = new Uint8Array(8);
    m[0] = 4;
    m[1] = down;
    m[4] = (k >>> 24) & 255;
    m[5] = (k >>> 16) & 255;
    m[6] = (k >>> 8) & 255;
    m[7] = k & 255;
    send(m);
  }
  canvas.addEventListener("keydown", (ev) => {
    const k = keysym(ev);
    if (k == null) return;
    ev.preventDefault();
    sendKey(k, 1);
  });
  canvas.addEventListener("keyup", (ev) => {
    const k = keysym(ev);
    if (k == null) return;
    ev.preventDefault();
    sendKey(k, 0);
  });

  api("GET", "/compute/machines/" + encodeURIComponent(id) + "/console").then((data) => {
    const path = (data && data.websocket) || "";
    if (!path.includes("console/vnc")) {
      status.textContent = "console/vnc path missing";
      return;
    }
    const proto = location.protocol === "https:" ? "wss://" : "ws://";
    ws = new WebSocket(proto + location.host + path);
    ws.binaryType = "arraybuffer";
    ws.addEventListener("message", (ev) => {
      if (!(ev.data instanceof ArrayBuffer)) { fail("console frame was not binary"); return; }
      append(new Uint8Array(ev.data));
      pump();
    });
    ws.addEventListener("close", () => {
      if (stage !== "dead") status.textContent = "Console closed";
    });
    ws.addEventListener("error", () => { status.textContent = "Console connection failed"; });
  }).catch((e) => { status.textContent = e.message; });
}

// The tab last opened on a machine page, kept while moving between machines.
let machineTab = "details";

async function renderMachine(id, gen) {
  const root = document.getElementById("view");
  root.replaceChildren();
  const back = el("button", "← Machines", "crumb"); back.type = "button";
  back.addEventListener("click", () => { openMachine = null; render(); });
  root.append(back);
  let machine;
  try {
    machine = await api("GET", "/compute/machines/" + encodeURIComponent(id));
  } catch (e) {
    if (gen !== renderGen) return;
    setErr(e.message);
    return;
  }
  if (gen !== renderGen) return;
  // Everything else is extra: the page is drawn with whatever answered.
  const quiet = (p) => p.catch(() => null);
  // The log names a machine the way the request did: by name, or by id.
  const audit = (who) => api("GET", "/identity/audit?order=desc&limit=25&resource=" + encodeURIComponent(who));
  const [fipPage, volPage, hostPage, samples, auditPage, auditById] = await Promise.all([
    quiet(api("GET", "/network/floating-ips")),
    quiet(api("GET", "/volume/volumes")),
    quiet(api("GET", "/compute/hosts")),
    quiet(usageSamples()),
    quiet(audit(machine.name)),
    quiet(audit(machine.id)),
  ]);
  if (gen !== renderGen) return;
  const fips = fipPage ? itemsOf(fipPage) : [];
  const vols = (volPage ? itemsOf(volPage) : [])
    .filter(v => v.status && String(v.status.attached_to || "") === String(machine.id));
  const hosts = hostPage ? itemsOf(hostPage) : [];
  const st = machine.status || {};
  const spec = machine.spec || {};
  const host = hosts.find(h => h.id === st.host);
  const hostName = host ? host.name : shortId(st.host);
  const power = String(st.power || "").toLowerCase();
  const mid = encodeURIComponent(machine.id);

  // ---- header ----
  const head = el("div", null, "mhead");
  const who = el("div", null, "who");
  const title = el("h2", machine.name);
  title.append(pill(st.phase));
  if (power) title.append(pill(power));
  const meta = el("p", null, "meta");
  const bits = [spec.kind, spec.size, spec.image, hostName ? "on " + hostName : "", "created " + ago(machine.created_at)]
    .filter(Boolean);
  bits.forEach((b, i) => { if (i) meta.append(" · "); meta.append(i < 3 ? el("b", b) : b); });
  who.append(title, meta);
  const acts = el("div", null, "acts");
  const act = (label, cls, path, method, after) => {
    const b = el("button", label, cls || ""); b.type = "button";
    b.addEventListener("click", async () => {
      if (method === "DELETE" && !confirm("Delete " + machine.name + "? Its root disk is removed.")) return;
      setErr("");
      b.disabled = true;
      try {
        await api(method || "POST", "/compute/machines/" + mid + (path || ""));
        if (after) after();
        await render();
      } catch (e) { b.disabled = false; setErr(e.message); }
    });
    return b;
  };
  const start = act("Start", "primary", "/start");
  const stop = act("Stop", "", "/stop");
  const reboot = act("Reboot", "", "/reboot");
  const del = act("Delete", "danger", "", "DELETE", () => { openMachine = null; });
  // Only what makes sense for the state it is in.
  start.hidden = power === "on";
  stop.hidden = power !== "on";
  reboot.disabled = power !== "on";
  acts.append(start, stop, reboot, del);
  head.append(who, acts);
  root.append(head);
  if (st.message && ["error", "failed"].includes(String(st.phase).toLowerCase())) {
    root.append(el("p", shortIds(st.message), "once"));
  }

  // ---- usage ----
  const mine = (l) => l.machine === machine.id;
  const rows = samples || [];
  const hist = {
    cpu: sumSeries(seriesOf(rows, "pistack_machine_cpu_usage_cores", mine)),
    mem: sumSeries(seriesOf(rows, "pistack_machine_memory_bytes", mine)),
    memMax: lastOf(sumSeries(seriesOf(rows, "pistack_machine_memory_assigned_bytes", mine))),
    dr: sumSeries(seriesOf(rows, "pistack_machine_disk_read_bytes_total", mine).map(asRate)),
    dw: sumSeries(seriesOf(rows, "pistack_machine_disk_written_bytes_total", mine).map(asRate)),
    rx: sumSeries(seriesOf(rows, "pistack_machine_network_receive_bytes_total", mine).map(asRate)),
    tx: sumSeries(seriesOf(rows, "pistack_machine_network_transmit_bytes_total", mine).map(asRate)),
  };
  const cards = {
    cpu: chartCard("CPU"),
    mem: chartCard("Memory"),
    disk: chartCard("Disk"),
    net: chartCard("Network"),
  };
  const charts = el("div", null, "charts");
  charts.append(cards.cpu.node, cards.mem.node, cards.disk.node, cards.net.node);
  root.append(charts);
  const none = samples === null
    ? "Usage could not be read"
    : power === "on" ? "No usage reported for this machine yet" : "The machine is off";
  const drawCharts = () => {
    const cpu = lastOf(hist.cpu);
    cards.cpu.draw(cpu === null ? null : fmtNum(cpu), cpu === null ? "" : "cores", [hist.cpu], { empty: none });
    const mem = lastOf(hist.mem);
    cards.mem.draw(mem === null ? null : fmtBytes(mem), hist.memMax ? "of " + fmtBytes(hist.memMax) : "",
      [hist.mem], { ceiling: hist.memMax || 0, empty: none });
    const dr = lastOf(hist.dr), dw = lastOf(hist.dw);
    cards.disk.draw(dw === null ? null : fmtBytes(dw) + "/s", dw === null ? "" : "written", [hist.dw, hist.dr],
      { empty: none, legend: dw === null ? [] : ["write", "read " + fmtBytes(dr || 0) + "/s"] });
    const rx = lastOf(hist.rx), tx = lastOf(hist.tx);
    cards.net.draw(rx === null ? null : fmtBytes(rx) + "/s", rx === null ? "" : "in", [hist.rx, hist.tx],
      { empty: none, legend: rx === null ? [] : ["in", "out " + fmtBytes(tx || 0) + "/s"] });
  };
  drawCharts();

  // ---- tabs ----
  const tabs = el("div", null, "tabs");
  tabs.setAttribute("role", "tablist");
  const pane = el("div");
  const panes = {
    details() {
      const kv = el("div", null, "kv");
      kv.append(
        kvLine("Name", machine.name),
        kvLine("ID", machine.id, true),
        kvLine("Project", shortId(machine.project), true),
        kvLine("Host", hostName),
        kvLine("Kind", spec.kind),
        kvLine("Size", spec.size),
        kvLine("Image", spec.image),
        kvLine("Created", machine.created_at ? new Date(machine.created_at).toLocaleString() : ""),
        kvLine("Restarts", st.restarts),
        kvLine("SSH keys", (spec.ssh_keys || []).length || "none"),
      );
      pane.append(kv);
      const conds = st.conditions || [];
      if (conds.length) {
        pane.append(el("h3", "Conditions"));
        const t = simpleTable([
          ["Condition", c => c.type],
          ["State", c => (c.status ? "yes" : "no")],
          ["Reason", c => c.reason],
          ["Since", c => ago(c.last_transition)],
          ["Message", c => (c.status ? "" : shortIds(c.message))],
        ], conds);
        t.className = "wrap";
        const wrap = el("div", null, "panel");
        wrap.append(t);
        pane.append(wrap);
      }
    },
    networking() {
      const kv = el("div", null, "kv");
      kv.append(
        kvLine("Networks", (spec.networks || []).join(", ")),
        kvLine("Private addresses", (st.addresses || []).join(", "), true),
        kvLine("Security groups", (spec.security_groups || []).join(", ") || "the project's default group"),
      );
      pane.append(kv);
      pane.append(el("h3", "Floating IPs"));
      const wrap = el("div", null, "panel");
      wrap.append(simpleTable([
        ["Address", f => f.spec && f.spec.address],
        ["Reaches", f => f.status && f.status.fixed_ip],
        ["Phase", f => f.status && f.status.phase],
      ], matchingFips(machine, fips)));
      pane.append(wrap);
    },
    volumes() {
      const wrap = el("div", null, "panel");
      wrap.append(simpleTable([
        ["Name", v => v.name],
        ["GiB", v => v.spec && v.spec.size_gib],
        ["Device", v => v.status && v.status.device],
        ["Phase", v => v.status && v.status.phase],
      ], vols));
      pane.append(wrap);
      pane.append(el("p", "Attach a volume from the Volumes page. It shows up in the guest as a virtio disk.", "sub"));
    },
    console() {
      const card = el("div", null, "detail");
      card.style.width = "100%";
      pane.append(card);
      if (power === "on") openConsole(card, machine.id);
      else card.append(el("p", "The machine is off. Start it to open its console.", "sub"));
    },
    activity() {
      const wrap = el("div", null, "panel");
      if (auditPage === null) wrap.append(el("p", "The record of who did what is kept for cloud admins."));
      else {
        const seen = new Set();
        const records = [...itemsOf(auditPage), ...(auditById ? itemsOf(auditById) : [])]
          .filter(r => !seen.has(r.id) && seen.add(r.id))
          .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
        wrap.append(activityFeed(records, "Nothing is recorded for this machine."));
      }
      pane.append(wrap);
    },
  };
  const names = { details: "Details", networking: "Networking", volumes: "Volumes (" + vols.length + ")", console: "Console", activity: "Activity" };
  if (!panes[machineTab]) machineTab = "details";
  const select = (key) => {
    machineTab = key;
    for (const b of tabs.children) b.setAttribute("aria-selected", String(b.dataset.tab === key));
    pane.replaceChildren();
    panes[key]();
  };
  for (const key of Object.keys(panes)) {
    const b = el("button", names[key]); b.type = "button";
    b.dataset.tab = key;
    b.setAttribute("role", "tab");
    b.addEventListener("click", () => select(key));
    tabs.append(b);
  }
  root.append(tabs, pane);
  select(machineTab);

  // ---- keeping it current ----
  const phase = String(st.phase || "").toLowerCase();
  if (["pending", "creating", "deleting", "updating"].includes(phase)) {
    timer = setInterval(() => {
      if (machineTab === "console" || root.contains(document.activeElement)) return;
      render();
    }, 3000);
    return;
  }
  // New points for the charts, without drawing the page again.
  const push = (list, t, v) => {
    if (v === null || (list.length && list[list.length - 1].t >= t)) return;
    list.push({ t, v });
    if (list.length > 120) list.shift();
  };
  timer = setInterval(async () => {
    if (document.hidden) return;
    let report;
    try { report = await api("GET", "/compute/machines/" + mid + "/stats"); } catch (e) { return; }
    if (gen !== renderGen) return;
    const series = (report && report.series) || [];
    const add = (name, field) => {
      const hits = series.filter(s => s.metric === name && s[field] !== undefined && s[field] !== null);
      if (!hits.length) return [0, null];
      return [Math.max(...hits.map(s => Date.parse(s.timestamp) || 0)), hits.reduce((n, s) => n + Number(s[field]), 0)];
    };
    const feed = (list, name, field) => { const [t, v] = add(name, field); push(list, t, v); };
    feed(hist.cpu, "pistack_machine_cpu_usage_cores", "value");
    feed(hist.mem, "pistack_machine_memory_bytes", "value");
    feed(hist.dr, "pistack_machine_disk_read_bytes_total", "rate");
    feed(hist.dw, "pistack_machine_disk_written_bytes_total", "rate");
    feed(hist.rx, "pistack_machine_network_receive_bytes_total", "rate");
    feed(hist.tx, "pistack_machine_network_transmit_bytes_total", "rate");
    drawCharts();
  }, 10000);
}

// What was done, newest first, from the audit log.
function activityFeed(records, empty) {
  if (!records.length) return el("p", empty || "Nothing recorded yet.");
  const ul = el("ul", null, "feed");
  for (const r of records) {
    const s = r.spec || {};
    const li = el("li", null, s.status >= 400 ? "bad" : "");
    const what = el("span", null, "what");
    what.append(el("b", s.principal || "someone"), " " + (s.action || String(s.method || "").toLowerCase()) +
      (s.kind ? " " + s.kind : "") + (s.resource ? " " + shortId(s.resource) : ""));
    what.title = (s.method || "") + " " + (s.path || "");
    li.append(el("span", ago(r.created_at), "when"), what, el("span", String(s.status || ""), "code"));
    ul.append(li);
  }
  return ul;
}

async function renderDns(root, gen) {
  let zones = [];
  let records = [];
  const problems = [];
  try { zones = itemsOf(await api("GET", "/dns/zones")); }
  catch (e) { problems.push(e.message); }
  if (gen !== renderGen) return;
  try { records = itemsOf(await api("GET", "/dns/recordsets")); }
  catch (e) { problems.push(e.message); }
  if (gen !== renderGen) return;
  if (problems.length) setErr(problems.join(" "));
  root.append(el("h3", "Zones"));
  root.append(simpleTable([
    ["Name", i => i.name],
    ["Phase", i => i.status && i.status.phase],
    ["Apex", i => i.spec && i.spec.name],
  ], zones));
  root.append(el("h3", "Records"));
  root.append(simpleTable([
    ["Name", i => i.spec && i.spec.name],
    ["Type", i => i.spec && i.spec.type],
    ["Records", i => ((i.spec && i.spec.records) || []).join(", ")],
  ], records));
}

async function renderBalancers(root, gen) {
  let lbs = [];
  let listeners = [];
  let pools = [];
  const problems = [];
  try { lbs = itemsOf(await api("GET", "/balancers/balancers")); }
  catch (e) { problems.push(e.message); }
  if (gen !== renderGen) return;
  try { listeners = itemsOf(await api("GET", "/balancers/listeners")); }
  catch (e) { problems.push(e.message); }
  if (gen !== renderGen) return;
  try { pools = itemsOf(await api("GET", "/balancers/pools")); }
  catch (e) { problems.push(e.message); }
  if (gen !== renderGen) return;
  if (problems.length) setErr(problems.join(" "));
  root.append(el("h3", "Balancers"));
  root.append(simpleTable([
    ["Name", i => i.name],
    ["Phase", i => i.status && i.status.phase],
    ["VIP", i => (i.status && i.status.vip) || (i.spec && i.spec.vip_address) || ""],
    ["Network", i => i.spec && i.spec.vip_network],
  ], lbs));
  root.append(el("h3", "Listeners"));
  root.append(simpleTable([
    ["Name", i => i.name],
    ["Phase", i => i.status && i.status.phase],
    ["Protocol", i => protoText(i.spec && i.spec.protocol)],
    ["Port", i => i.spec && i.spec.port],
    ["Balancer", i => i.spec && i.spec.balancer],
  ], listeners));
  root.append(el("h3", "Pools"));
  root.append(simpleTable([
    ["Name", i => i.name],
    ["Phase", i => i.status && i.status.phase],
    ["Protocol", i => protoText(i.spec && i.spec.protocol)],
    ["Algorithm", i => i.spec && i.spec.algorithm],
    ["Members", i => i.status && i.status.members],
    ["Balancer", i => i.spec && i.spec.balancer],
  ], pools));
}

// ---- overview -------------------------------------------------------------

function phaseOf(i) { return String((i.status && i.status.phase) || "").toLowerCase(); }
function meter(used, total) {
  const m = el("div", null, "meter");
  const pct = total > 0 ? Math.min(100, Math.round(used * 100 / total)) : 0;
  if (pct >= 95) m.classList.add("full"); else if (pct >= 80) m.classList.add("high");
  const bar = el("i");
  bar.style.width = pct + "%";
  m.append(bar);
  m.title = pct + "% in use";
  return m;
}
function tile(view, label, value, unit, hint, bar, bad) {
  const t = el("button", null, "tile");
  t.type = "button";
  t.append(el("div", label, "label"));
  const v = el("div", String(value), "value");
  if (unit) { v.append(" "); v.append(el("small", unit)); }
  t.append(v);
  if (bar) t.append(bar);
  if (hint) t.append(el("div", hint, bad ? "hint bad" : "hint"));
  t.addEventListener("click", () => go(view));
  return t;
}
function gib(mib) { return Math.round(mib / 102.4) / 10; }

async function renderOverview(root, gen) {
  const wanted = ["hosts", "machines", "pods", "networks", "fips", "volumes", "images", "alarms"];
  const got = {};
  const failed = [];
  await Promise.all(wanted.map(async (v) => {
    try { got[v] = itemsOf(await api("GET", VIEWS[v].path)); }
    catch (e) { got[v] = []; failed.push(VIEWS[v].title); }
  }));
  // Extras that only some callers may read. The page is whole without them.
  const quiet = (p) => p.catch(() => null);
  const [cluster, samples, auditPage, info] = await Promise.all([
    quiet(api("GET", "/cluster")),
    quiet(usageSamples()),
    quiet(api("GET", "/identity/audit?order=desc&limit=8")),
    quiet(api("GET", "/", undefined, false)),
  ]);
  if (gen !== renderGen) return;
  for (const v of wanted) if (!failed.includes(VIEWS[v].title)) setCount(v, got[v].length);
  if (failed.length === wanted.length) { setErr("The server did not answer. Is it still running?"); return; }

  const tools = el("div", null, "tools");
  tools.append(el("h2", "Overview"), el("span", null, "grow"));
  const refresh = el("button", "Refresh"); refresh.type = "button";
  refresh.addEventListener("click", () => render());
  tools.append(refresh);
  root.append(tools);

  const hosts = got.hosts;
  const ready = hosts.filter(h => phaseOf(h) === "ready");
  let cpuAll = 0, cpuFree = 0, memAll = 0, memFree = 0;
  for (const h of ready) {
    const cap = (h.spec && h.spec.capacity) || {};
    const free = (h.status && h.status.free) || {};
    cpuAll += cap.vcpus || 0; cpuFree += free.vcpus || 0;
    memAll += cap.memory_mib || 0; memFree += free.memory_mib || 0;
  }
  const machines = got.machines;
  const on = machines.filter(m => phaseOf(m) === "ready" && String(m.status.power || "").toLowerCase() === "on");
  const firing = got.alarms.filter(a => phaseOf(a) === "firing" || String((a.status && a.status.state) || "").toLowerCase() === "firing");
  const volGib = got.volumes.reduce((n, v) => n + ((v.spec && v.spec.size_gib) || 0), 0);

  const tiles = el("div", null, "tiles");
  tiles.append(
    tile("machines", "Machines", on.length, "of " + machines.length + " running"),
    tile("hosts", "Hosts", ready.length, "of " + hosts.length + " ready",
      hosts.length > ready.length ? (hosts.length - ready.length) + " not ready" : "", null, true),
    tile("hosts", "vCPU in use", cpuAll - cpuFree, "of " + cpuAll, cpuFree + " free", meter(cpuAll - cpuFree, cpuAll)),
    tile("hosts", "Memory in use", gib(memAll - memFree), "of " + gib(memAll) + " GiB", gib(memFree) + " GiB free", meter(memAll - memFree, memAll)),
    tile("pods", "Pods", got.pods.length),
    tile("networks", "Networks", got.networks.length, "", got.fips.length + " floating IPs"),
    tile("volumes", "Volumes", got.volumes.length, "", volGib + " GiB provisioned"),
    tile("alarms", "Alarms firing", firing.length, "of " + got.alarms.length, "", null, firing.length > 0),
  );
  root.append(tiles);

  // The servers that run this cloud, as the one answering sees them.
  if (cluster && Array.isArray(cluster.members)) {
    const strip = el("div", null, "strip");
    strip.append(el("span", "Control plane", "name"));
    const voters = cluster.members.filter(m => String(m.role).toLowerCase() === "voter");
    for (const m of cluster.members) {
      const srv = el("span", null, "srv");
      srv.append(String(m.api || "").replace(/^https?:\/\//, ""));
      const leads = m.id === cluster.leader_id;
      srv.append(pill(leads ? "leader" : String(m.role || "").toLowerCase()));
      srv.title = m.id;
      strip.append(srv);
    }
    const facts = [voters.length + (voters.length === 1 ? " voter" : " voters")];
    if (!cluster.leader_id) facts.unshift("no leader");
    if (cluster.commit !== undefined) facts.push("entry " + cluster.commit);
    if (info && info.version) facts.push("build " + info.version);
    strip.append(el("span", facts.join(" · "), cluster.leader_id ? "facts" : "facts bad"));
    root.append(strip);
  }

  // The last minutes, added up across hosts and machines.
  if (samples !== null) {
    const rows = samples;
    const load = sumSeries(seriesOf(rows, "pistack_host_load1"));
    const memUsed = sumSeries(seriesOf(rows, "pistack_host_memory_used_bytes"));
    const memTotal = lastOf(sumSeries(seriesOf(rows, "pistack_host_memory_total_bytes")));
    const cores = sumSeries(seriesOf(rows, "pistack_machine_cpu_usage_cores"));
    const rx = sumSeries(seriesOf(rows, "pistack_machine_network_receive_bytes_total").map(asRate));
    const tx = sumSeries(seriesOf(rows, "pistack_machine_network_transmit_bytes_total").map(asRate));
    const empty = "No samples on this server. The leader keeps them.";
    const charts = el("div", null, "charts");
    const c1 = chartCard("Host load"), c2 = chartCard("Host memory"), c3 = chartCard("Machine CPU"), c4 = chartCard("Machine network");
    charts.append(c1.node, c2.node, c3.node, c4.node);
    const v1 = lastOf(load), v2 = lastOf(memUsed), v3 = lastOf(cores), v4 = lastOf(rx);
    c1.draw(v1 === null ? null : fmtNum(v1), v1 === null ? "" : "across " + ready.length + (ready.length === 1 ? " host" : " hosts"), [load], { empty });
    c2.draw(v2 === null ? null : fmtBytes(v2), memTotal ? "of " + fmtBytes(memTotal) : "", [memUsed], { ceiling: memTotal || 0, empty });
    c3.draw(v3 === null ? null : fmtNum(v3), v3 === null ? "" : "cores busy", [cores], { empty });
    c4.draw(v4 === null ? null : fmtBytes(v4) + "/s", v4 === null ? "" : "in", [rx, tx],
      { empty, legend: v4 === null ? [] : ["in", "out " + fmtBytes(lastOf(tx) || 0) + "/s"] });
    root.append(charts);
  }

  // Anything that is not healthy, across what was fetched.
  const trouble = [];
  for (const v of wanted) {
    for (const i of got[v]) {
      const ph = phaseOf(i);
      if (["error", "failed", "firing"].includes(ph)) trouble.push({ view: v, item: i });
    }
  }
  const split = el("div", null, "split");
  const left = el("div");
  left.append(el("h3", "Needs attention"));
  const panel = el("div", null, "panel");
  if (!trouble.length) {
    panel.append(el("p", "Nothing is in an error state."));
  } else {
    const t = simpleTable([
      ["Kind", r => VIEWS[r.view].title],
      ["Name", r => r.item.name],
      ["Phase", r => r.item.status && r.item.status.phase],
      ["Message", r => shortIds((r.item.status && r.item.status.message) || "").slice(0, 160)],
    ], trouble.slice(0, 12));
    t.className = "wrap";
    [...t.querySelectorAll("tbody tr")].forEach((tr, idx) => {
      const r = trouble[idx];
      const cell = tr.children[1];
      const b = el("button", r.item.name || "—", "linkish"); b.type = "button";
      b.addEventListener("click", () => {
        go(r.view);
        if (r.view === "machines") { openMachine = r.item.id; render(); }
      });
      cell.replaceChildren(b);
    });
    panel.append(t);
  }
  left.append(panel);

  const right = el("div");
  right.append(el("h3", "Hosts"));
  const hp = el("div", null, "panel");
  if (!hosts.length) {
    hp.append(el("p", "No host has joined yet. Start an agent with pistack agent --join."));
  } else {
    const t = simpleTable([
      ["Name", i => i.name],
      ["Phase", i => i.status && i.status.phase],
      ["vCPU", () => ""],
      ["Memory", () => ""],
    ], hosts.slice(0, 12));
    [...t.querySelectorAll("tbody tr")].forEach((tr, idx) => {
      const h = hosts[idx];
      const cap = (h.spec && h.spec.capacity) || {};
      const free = (h.status && h.status.free) || {};
      const cpu = (cap.vcpus || 0) - (free.vcpus || 0);
      const mem = (cap.memory_mib || 0) - (free.memory_mib || 0);
      tr.children[2].replaceChildren(meter(cpu, cap.vcpus || 0), cpu + " / " + (cap.vcpus || 0));
      tr.children[3].replaceChildren(meter(mem, cap.memory_mib || 0), gib(mem) + " / " + gib(cap.memory_mib || 0) + " GiB");
    });
    hp.append(t);
  }
  right.append(hp);
  split.append(left, right);
  root.append(split);

  if (auditPage !== null) {
    root.append(el("h3", "Recent activity"));
    const ap = el("div", null, "panel");
    ap.append(activityFeed(itemsOf(auditPage)));
    root.append(ap);
  }
  if (failed.length) setErr("Could not read: " + failed.join(", ") + ".");
}

// `soft` is a background reload: the page is built off-screen and swapped
// in when it is complete, so nothing flickers, and a failed reload leaves
// what was on screen.
async function render(soft) {
  const gen = ++renderGen;
  clearInterval(timer);
  const view = VIEWS[current];
  const live = document.getElementById("view");
  if (current === "machines" && openMachine) {
    setErr("");
    await renderMachine(openMachine, gen);
    return;
  }
  const root = soft ? el("div") : live;
  if (!soft) live.replaceChildren();
  setErr("");
  await renderInto(root, view, gen);
  if (gen !== renderGen) return;
  if (soft) {
    if (lastErr) return;
    live.replaceChildren(...root.childNodes);
  }
  applyFilter();
}

async function renderInto(root, view, gen) {
  if (current === "overview") { await renderOverview(root, gen); return; }
  const form = readOnly ? null : createForm();
  const tools = el("div"); tools.className = "tools";
  tools.append(el("h2", view.title));
  const chip = el("span", null, "chip");
  tools.append(chip, el("span", null, "grow"));
  if (form) {
    const open = !!formOpen[current];
    form.hidden = !open;
    const toggle = el("button", open ? "Close" : "Create", open ? "" : "primary");
    toggle.type = "button";
    toggle.addEventListener("click", () => {
      formOpen[current] = form.hidden;
      form.hidden = !form.hidden;
      toggle.textContent = form.hidden ? "Create" : "Close";
      toggle.className = form.hidden ? "primary" : "";
      if (!form.hidden) { const first = form.querySelector("input, select, textarea"); if (first) first.focus(); }
    });
    tools.append(toggle);
  }
  const refresh = el("button", "Refresh"); refresh.type = "button";
  refresh.addEventListener("click", () => render());
  tools.append(refresh);
  root.append(tools);
  if (view.note) {
    const note = el("p", view.note);
    note.id = "note";
    root.append(note);
  }
  if (current === "keys" && keyOnce) {
    const shown = keyOnce;
    keyOnce = null;
    root.append(el("p", "Copy this key secret now. It is not shown again. " + shown, "once"));
  }
  if (form) root.append(form);
  if (view.multi === "dns") { await renderDns(root, gen); return; }
  if (view.multi === "balancers") { await renderBalancers(root, gen); return; }
  let page;
  try { page = await api("GET", view.path); }
  catch (e) {
    if (gen !== renderGen) return;
    setErr(e.message);
    return;
  }
  if (gen !== renderGen) return;
  if (current === "machines") {
    try {
      const fp = await api("GET", "/network/floating-ips");
      if (gen !== renderGen) return;
      machineFips = itemsOf(fp);
    } catch (e) {
      if (gen !== renderGen) return;
      machineFips = [];
      setErr(e.message);
    }
  }
  const items = itemsOf(page);
  setCount(current, items.length);
  chip.textContent = String(items.length);
  root.append(simpleTable(view.cols, items));
  const table = root.lastElementChild;
  const body = table.querySelector("tbody");
  const rowAction = !!(view.actions || view.apply);
  if (rowAction || view.rules) {
    const head = table.querySelector("tr");
    if (rowAction) head.append(el("th", ""));
    const rows = body.querySelectorAll("tr");
    if (!items.length) {
      const td = rows[0] && rows[0].firstChild;
      if (td) td.colSpan = view.cols.length + (rowAction ? 1 : 0);
    } else {
      items.forEach((item, idx) => {
        const tr = rows[idx];
        if (!tr) return;
        if (current === "machines") {
          const nameCell = tr.firstChild;
          if (nameCell) {
            nameCell.replaceChildren();
            const btn = el("button", item.name || "—");
            btn.type = "button";
            btn.className = "linkish";
            btn.addEventListener("click", () => { openMachine = item.id; render(); });
            nameCell.append(btn);
          }
        }
        if (view.rules) {
          const rules = (item.spec && item.spec.rules) || [];
          const cell = tr.children[2];
          if (cell) {
            cell.replaceChildren(document.createTextNode(String(rules.length)));
            if (rules.length) {
              const ul = el("ul"); ul.className = "rules";
              for (const r of rules) ul.append(el("li", ruleLine(r)));
              cell.append(ul);
            }
          }
        }
        if (rowAction) {
          const td = el("td");
          if (view.actions) {
            const start = el("button", "Start"); start.type = "button";
            const stop = el("button", "Stop"); stop.type = "button";
            const del = el("button", "Delete"); del.type = "button"; del.className = "danger";
            start.addEventListener("click", async () => {
              setErr("");
              try { await api("POST", view.path + "/" + item.id + "/start"); await render(); }
              catch (e) { setErr(e.message); }
            });
            stop.addEventListener("click", async () => {
              setErr("");
              try { await api("POST", view.path + "/" + item.id + "/stop"); await render(); }
              catch (e) { setErr(e.message); }
            });
            del.addEventListener("click", async () => {
              if (!confirm("Delete " + item.name + "?")) return;
              setErr("");
              try { await api("DELETE", view.path + "/" + item.id); await render(); }
              catch (e) { setErr(e.message); }
            });
            td.append(start, document.createTextNode(" "), stop, document.createTextNode(" "), del);
          }
          if (view.apply) {
            const apply = el("button", "Apply"); apply.type = "button";
            apply.addEventListener("click", async () => {
              setErr("");
              apply.disabled = true;
              try {
                await api("POST", view.path + "/" + item.id + "/apply");
                await render();
              } catch (e) { setErr(e.message); }
              apply.disabled = false;
            });
            if (td.childNodes.length) td.append(document.createTextNode(" "));
            td.append(apply);
          }
          const history = (item.status && item.status.history) || [];
          if (view.rollback && history.length > 1) {
            const back = el("button", "Roll back"); back.type = "button";
            back.addEventListener("click", async () => {
              if (!confirm("Roll " + item.name + " back to its previous revision?")) return;
              setErr("");
              back.disabled = true;
              try {
                await api("POST", view.path + "/" + item.id + "/rollback");
                await render();
              } catch (e) { setErr(e.message); }
              back.disabled = false;
            });
            td.append(document.createTextNode(" "), back);
          }
          tr.append(td);
        }
      });
    }
  }
  if (current === "volumes") {
    try {
      const snaps = itemsOf(await api("GET", "/volume/snapshots"));
      if (gen !== renderGen) return;
      root.append(el("h3", "Snapshots"));
      root.append(simpleTable([
        ["Name", i => i.name],
        ["Phase", i => i.status && i.status.phase],
        ["Volume", i => i.spec && i.spec.volume],
        ["GiB", i => i.status && i.status.size_gib],
      ], snaps));
    } catch (e) {
      if (gen !== renderGen) return;
      setErr(e.message);
    }
  }
}

if (token()) {
  api("GET", "/identity/tokens/self").then((who) => {
    setWho(who || {}, "signed in");
    showApp();
    go(hashView(), true);
    loadCounts();
  }).catch(() => showLogin());
}
