pistack-rpc.workspace = true
gate.workspace = true
forge.workspace = true
loom.workspace = true
anvil.workspace = true
fabric.workspace = true
slab = { workspace = true }
mold.workspace = true
silo.workspace = true
shelf.workspace = true
beacon.workspace = true
relay.workspace = true
keep.workspace = true
blueprint.workspace = true
gauge.workspace = true
bench.workspace = true

tokio.workspace = true
tokio-util = { workspace = true, features = ["io"] }
tokio-rustls.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true
reqwest.workspace = true
