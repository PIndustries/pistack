[package]
name = "pistack"
description = "PiStack: one binary, every module. `pistack server` is the control plane, `pistack agent` is a host."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pistack"
path = "src/main.rs"

[dependencies]
