# Builds what people download: release tarballs for Linux x86_64 and aarch64,
# and the server and agent container images. Runs when a build tag is pushed
# and when someone starts it by hand, never on a pull request, and nothing in
# ci.yml waits for it. Do not make it a required check.
#
# A build is numbered by its date: <year>.<month>.<day>.<build>, as in
# 26.11.12.1. A run on such a tag publishes a GitHub Release, pushes the images
# and moves "latest". A run started by hand on a branch is a rehearsal: it
# builds and checks everything and publishes nothing. docs/RELEASING.md has the
# steps.
name: release
on:
  push:
    # Wide on purpose. The plan job checks the tag properly and fails a wrong one.
    tags: ["[0-9][0-9].[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/pindustries/pistack

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: version
        id: plan
        run: |
          set -euo pipefail
          # Two-digit year, month 1-12, day 1-31, build from 1, no leading zeros.
          build_re='^[1-9][0-9]\.(1[0-2]|[1-9])\.(3[01]|[12][0-9]|[1-9])\.[1-9][0-9]*$'
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if ! [[ "$GITHUB_REF_NAME" =~ $build_re ]]; then
              echo "::error::tag $GITHUB_REF_NAME is not a build number. Want <year>.<month>.<day>.<build> with a two-digit year, no leading zeros and the build counting from 1, as in 26.11.12.1"
              exit 1
            fi
            version="$GITHUB_REF_NAME"
            publish=true
          else
            version="dev.$(git rev-parse --short HEAD)"
            publish=false
          fi
          {
            echo "version=$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, publish $publish" >> "$GITHUB_STEP_SUMMARY"

  # The runner image sets the oldest glibc the binaries run on (22.04: 2.35).
  tarball:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No build cache on purpose: a release is built from clean.
      - name: build
        env:
          PISTACK_BUILD: ${{ needs.plan.outputs.version }}
        run: cargo build --release --locked -p pistack -p bench
      - name: pack
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$ARCH"
          packaging/make-tarball.sh target/release "$VERSION" "$ARCH" dist
      - name: install from the tarball
        run: |
          set -euo pipefail
          name="pistack-$VERSION-linux-$ARCH"
          (cd dist && sha256sum -c "$name.tar.gz.sha256")
          tar -xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP"
          sudo "$RUNNER_TEMP/$name/install.sh"
          pistack --version
          pi --version
          test "$(pistack --version)" = "pistack $VERSION"
          test "$(pi --version)" = "pi $VERSION"
          for h in pistack-overlay pistack-fip pistack-shelf-helper pistack-youki-cleanup; do
            test -x "/usr/local/sbin/$h"
          done
          systemd-analyze verify /etc/systemd/system/pistack-server.service \
            /etc/systemd/system/pistack-agent.service
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Each architecture builds on its own runner, so nothing compiles under
  # emulation. On a tag the images are pushed by digest and joined below.
  image:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: builder
        run: docker buildx create --use --name release
      - name: build and try
        run: |
          set -euo pipefail
          for target in server agent; do
            docker buildx build --target "$target" --build-arg "PISTACK_BUILD=$VERSION" \
              --load -t "pistack:$target" .
            docker run --rm "pistack:$target" --version
            docker run --rm --entrypoint /usr/local/bin/pi "pistack:$target" --version
            test "$(docker run --rm "pistack:$target" --version)" = "pistack $VERSION"
            test "$(docker run --rm --entrypoint /usr/local/bin/pi "pistack:$target" --version)" = "pi $VERSION"
          done
          test "$(docker run --rm --entrypoint id pistack:agent -u)" = 0
          test "$(docker image inspect -f '{{.Config.User}}' pistack:server)" = 65532:65532
      - name: push by digest
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir -p digests
          for target in server agent; do
            # The same build argument as above, so this is the build that was tried.
            docker buildx build --target "$target" --build-arg "PISTACK_BUILD=$VERSION" \
              --label "org.opencontainers.image.version=$VERSION" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "meta-$target.json" .
            jq -r '."containerimage.digest"' "meta-$target.json" > "digests/$target-$ARCH"
          done
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  manifest:
    needs: [plan, tarball, image]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - name: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # server: VERSION and latest. agent: VERSION-agent and latest-agent.
          for target in server agent; do
            suffix=""
            [ "$target" = agent ] && suffix="-agent"
            docker buildx imagetools create \
              -t "$IMAGE:$VERSION$suffix" -t "$IMAGE:latest$suffix" \
              "$IMAGE@$(cat "digests/$target-x86_64")" \
              "$IMAGE@$(cat "digests/$target-aarch64")"
            docker buildx imagetools inspect "$IMAGE:$VERSION$suffix"
          done

  github-release:
    needs: [plan, tarball, manifest]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: |
          set -euo pipefail
          cat ./*.tar.gz.sha256 > SHA256SUMS
          rm ./*.tar.gz.sha256
          sha256sum -c SHA256SUMS
      - name: publish
        run: |
          set -euo pipefail
          # A re-run for the same tag replaces the files and keeps the notes.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest \
              --title "PiStack $GITHUB_REF_NAME" dist/*
          fi
